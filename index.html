
<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Matteo ♡ Hoà — Lễ Hằng Thuận</title>

<style>

/* =====================================
   1. COLORS AND FONTS
   EDIT HERE
===================================== */

:root {
  --olive: #59653a;
  --brown: #856b4e;
  --cream: #fffaf3;
  --font: Georgia, "Times New Roman", serif;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #f5f0e8;
  color: var(--olive);
  font-family: var(--font);
}

main {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 8px;
}

/* =====================================
   2. IMAGE CONTAINER
===================================== */

.card {
  position: relative;
  width: min(
    100%,
    min(490px, calc((100svh - 16px) * .6082))
  );
  aspect-ratio: 978 / 1608;
  overflow: hidden;
  border-radius: 6% / 3.6%;
  background: var(--cream);
  isolation: isolate;
  container-type: inline-size;
}

/* =====================================
   3. PAGE TRANSITIONS
===================================== */

.page {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: scale(1.015);

  transition:
    opacity .65s ease,
    transform .65s ease,
    visibility .65s;
}

.page.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: scale(1);
}

.artwork {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.overlay {
  position: absolute;
  inset: 0;
}

button,
input,
textarea {
  font-family: var(--font);
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--olive);
  outline-offset: 2px;
}

/* =====================================
   4. COVER PAGE
   APRI / MỞ THIỆP
===================================== */

.cover-action {
  position: absolute;
  top: 87.5%;
  height: 5%;
  border: none;
  background: transparent;
  border-radius: 30px;
}

#openItalian {
  left: 31%;
  width: 18%;
}

#openVietnamese {
  left: 50%;
  width: 24%;
}

/* =====================================
   5. PAGE 2: CEREMONY DETAILS
===================================== */

.detail-text {
  position: absolute;
  background: transparent;
  border: none;
  color: var(--brown);

  font-size: clamp(9px, 2.5cqw, 14px);
  line-height: 1.25;
  text-align: center;

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}

/* DATE AND TIME */

#dateTimeText {
  left: 28%;
  top: 35.2%;
  width: 62%;
  height: 7.4%;
}

/* LOCATION */

#locationField {
  left: 44%;
  top: 46.3%;
  width: 31%;
  height: 7%;
  flex-direction: column;
  gap: 3px;
}

#venueText {
  font-size: 1em;
}

#addressText {
  font-size: .86em;
}

/* DRESS CODE */

#dressText {
  left: 28%;
  top: 58.2%;
  width: 62%;
  height: 7%;
}

/* =====================================
   6. SMALL MAP BUTTON
   RIGHT SIDE OF LOCATION ROW

   Transparent clickable area over
   the small green button in details.png
===================================== */

#mapButton {
  position: absolute;

  left: 77%;
  top: 47.5%;

  width: 11%;
  height: 4%;

  border: none;
  border-radius: 99px;
  background: transparent;
}

/* =====================================
   7. PAGE 2: GO TO RSVP

   ABOVE BOTTOM LOTUS
===================================== */

#goRSVP {
  position: absolute;

  left: 26%;
  top: 76%;

  width: 48%;
  height: 4.6%;

  padding: 0 5px;
  border: 1px solid var(--olive);
  border-radius: 30px;

  background: rgba(255, 250, 243, .92);
  color: var(--olive);

  font-size: clamp(10px, 2.8cqw, 15px);
}

/* BACK BUTTONS */

.back {
  position: absolute;
  right: 5%;
  bottom: 2%;

  padding: 6px 11px;
  border: 1px solid #9b967e;
  border-radius: 20px;

  background: rgba(255, 250, 243, .94);
  color: var(--olive);

  font-size: clamp(9px, 2.3cqw, 12px);
}

/* =====================================
   8. PAGE 3: RSVP TITLE

   TITLE IS HTML, NOT IN IMAGE.
   LANGUAGE CHANGES AUTOMATICALLY.
===================================== */

.rsvp-title {
  position: absolute;

  top: 19%;
  left: 9%;
  width: 82%;

  margin: 0;
  text-align: center;

  color: var(--olive);
  font-size: clamp(14px, 4.2cqw, 23px);
  font-weight: 400;
  font-style: normal;
  letter-spacing: .07em;
  line-height: 1.2;

  background: transparent;
  pointer-events: none;
}

/* =====================================
   9. RSVP INPUT FIELDS
   NO WHITE BACKGROUNDS
===================================== */

.rsvp-input,
.rsvp-message {
  position: absolute;

  left: 21%;
  width: 64%;

  margin: 0;
  padding: 0 7px;

  border: none;
  outline: none;
  box-shadow: none;
  background: transparent;

  color: var(--olive);
  font-size: clamp(10px, 2.6cqw, 14px);
}

.rsvp-input::placeholder,
.rsvp-message::placeholder {
  color: #8e8979;
  opacity: 1;
}

/* FIELD 1: NAME */

#guestName {
  top: 53.6%;
  height: 2.7%;
}

/* FIELD 2: NUMBER OF GUESTS */

#guestCountLabel {
  position: absolute;

  left: 21%;
  top: 58.7%;
  width: 43%;
  height: 2.8%;

  display: flex;
  align-items: center;

  color: #8e8979;
  font-size: clamp(9px, 2.5cqw, 13px);
  pointer-events: none;
}

/* MINUS / PLUS */

.guest-counter {
  position: absolute;

  left: 67%;
  top: 58.7%;

  width: 18%;
  height: 2.8%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  color: var(--olive);
}

.guest-counter button {
  border: none;
  background: transparent;
  color: var(--olive);

  font-size: clamp(17px, 4cqw, 22px);
  padding: 0 3px;
}

.guest-counter span {
  font-size: clamp(11px, 3cqw, 15px);
}

/* FIELD 3: DEPARTURE */

#departure {
  top: 64.3%;
  height: 2.7%;
}

/* FIELD 4: MESSAGE */

#guestMessage {
  top: 69.2%;
  height: 5.4%;

  resize: none;
  padding-top: 5px;

  font-size: clamp(9px, 2.25cqw, 12px);
  line-height: 1.2;
}

/* FIELD 5: DIETARY / ALLERGIES */

#dietary {
  top: 77.1%;
  height: 2.7%;
}

/* =====================================
   10. RSVP SUBMIT BUTTON

   Text appears over the illustrated
   green button.
===================================== */

#submitRSVP {
  position: absolute;

  left: 27%;
  top: 84.3%;

  width: 46%;
  height: 5%;

  padding: 0 12% 0 3%;

  border: none;
  border-radius: 40px;
  background: transparent;

  color: #fffaf2;
  font-size: clamp(10px, 2.7cqw, 14px);
  text-align: center;
}

#submitRSVP:disabled {
  opacity: .65;
  cursor: wait;
}

/* SUBMISSION STATUS */

#rsvpStatus {
  position: absolute;

  top: 90%;
  left: 12%;
  width: 76%;

  font-size: clamp(9px, 2.3cqw, 12px);
  text-align: center;
  color: var(--olive);
}

/* =====================================
   11. FLOATING PETALS
===================================== */

.petal {
  position: absolute;
  z-index: 5;
  top: -3%;

  width: 7px;
  height: 5px;

  background: #e8d0b6;
  opacity: .35;
  border-radius: 80% 0 80% 0;

  pointer-events: none;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform:
      translate(30px, 900px)
      rotate(500deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .page {
    transition: none;
  }

  .petal {
    display: none;
  }
}

</style>
</head>

<body>

<main>

<div class="card" id="card">

<!-- =====================================
     PAGE 1: COVER
===================================== -->

<section
  class="page active"
  id="coverPage"
  aria-hidden="false"
>

  <img
    class="artwork"
    src="cover.png"
    alt="Lễ Hằng Thuận — Matteo và Hoà"
  >

  <div class="overlay">

    <!-- ITALIAN -->
    <button
      class="cover-action"
      id="openItalian"
      type="button"
      aria-label="Apri l'invito in italiano"
      onclick="openInvitation('it')"
    ></button>

    <!-- VIETNAMESE -->
    <button
      class="cover-action"
      id="openVietnamese"
      type="button"
      aria-label="Mở thiệp tiếng Việt"
      onclick="openInvitation('vi')"
    ></button>

  </div>

</section>

<!-- =====================================
     PAGE 2: DETAILS
===================================== -->

<section
  class="page"
  id="detailsPage"
  aria-hidden="true"
  inert
>

  <img
    class="artwork"
    src="details.png"
    alt="Duyên Lành Hội Ngộ"
  >

  <div class="overlay">

    <!-- DATE AND TIME -->
    <div
      class="detail-text"
      id="dateTimeText"
    ></div>

    <!-- LOCATION -->
    <div
      class="detail-text"
      id="locationField"
    >
      <span id="venueText"></span>
      <small id="addressText"></small>
    </div>

    <!-- SMALL MAP BUTTON -->
    <button
      type="button"
      id="mapButton"
      onclick="openMap()"
      aria-label="Open map directions"
    ></button>

    <!-- DRESS CODE -->
    <div
      class="detail-text"
      id="dressText"
    ></div>

    <!-- RSVP BUTTON -->
    <button
      type="button"
      id="goRSVP"
      onclick="showPage('rsvpPage')"
    ></button>

    <!-- BACK -->
    <button
      type="button"
      class="back"
      id="backToCover"
      onclick="showPage('coverPage')"
    ></button>

  </div>

</section>

<!-- =====================================
     PAGE 3: RSVP
===================================== -->

<section
  class="page"
  id="rsvpPage"
  aria-hidden="true"
  inert
>

  <img
    class="artwork"
    src="rsvp.png"
    alt="Wedding attendance form"
  >

  <form
    class="overlay"
    id="rsvpForm"
    onsubmit="submitRSVP(event)"
  >

    <!-- LANGUAGE-SWITCHING TITLE -->
    <h2
      class="rsvp-title"
      id="rsvpTitle"
    ></h2>

    <!-- 1. NAME -->
    <input
      class="rsvp-input"
      id="guestName"
      name="name"
      type="text"
      autocomplete="name"
      maxlength="150"
      required
      aria-label="Guest name"
    >

    <!-- 2. GUEST COUNTER -->
    <span id="guestCountLabel"></span>

    <div class="guest-counter">

      <button
        type="button"
        id="minusGuest"
        onclick="changeGuests(-1)"
        aria-label="Remove guest"
      >−</button>

      <span id="guestCount">1</span>

      <button
        type="button"
        id="plusGuest"
        onclick="changeGuests(1)"
        aria-label="Add guest"
      >+</button>

    </div>

    <!-- 3. DEPARTURE LOCATION -->
    <input
      class="rsvp-input"
      id="departure"
      name="departure"
      type="text"
      maxlength="150"
      aria-label="Departure location"
    >

    <!-- 4. OPTIONAL MESSAGE -->
    <textarea
      class="rsvp-message"
      id="guestMessage"
      name="message"
      maxlength="1000"
      aria-label="Additional guests, questions and requests"
    ></textarea>

    <!-- 5. FOOD / ALLERGIES -->
    <input
      class="rsvp-input"
      id="dietary"
      name="dietary"
      type="text"
      maxlength="300"
      aria-label="Dietary needs and allergies"
    >

    <!-- SUBMIT -->
    <button
      type="submit"
      id="submitRSVP"
    ></button>

    <div
      id="rsvpStatus"
      role="status"
      aria-live="polite"
    ></div>

    <!-- BACK -->
    <button
      type="button"
      class="back"
      id="backToDetails"
      onclick="showPage('detailsPage')"
    ></button>

  </form>

</section>

</div>
</main>

<script>

/* =====================================
   12. EDIT YOUR INVITATION INFORMATION
===================================== */

const SETTINGS = {

  // Paste Google Maps link here
  googleMapsUrl: "",

  // Paste Google Apps Script /exec URL here
  googleScriptUrl: "",

  /* =================================
     VIETNAMESE VERSION
  ================================= */

  vi: {

    date: "Ngày / Tháng / Năm",
    time: "Giờ bắt đầu",

    venue: "Tên chùa / Địa điểm",
    address: "Địa chỉ đầy đủ",

    dresscode: "Áo dài truyền thống",

    rsvpTitle: "XÁC NHẬN THAM DỰ",

    nextButton: "XÁC NHẬN THAM DỰ →",
    rsvpButton: "GỬI XÁC NHẬN",
    back: "← Quay lại",

    name: "Họ và tên",
    guests: "Số lượng tham dự",

    departure: "Bạn khởi hành từ đâu?",

    messageHint:
      "Vui lòng ghi tên những người đi cùng hoặc các yêu cầu, dịch vụ hay câu hỏi khác (nếu có).",

    dietary:
      "Yêu cầu ăn uống / Dị ứng (nếu có)",

    sending: "Đang gửi...",

    sent:
      "Đã gửi phản hồi. Vui lòng kiểm tra Google Sheets để xác nhận.",

    error:
      "Không thể gửi. Vui lòng thử lại.",

    noScript:
      "Chưa kết nối Google Sheets.",

    noMap:
      "Chưa có liên kết Google Maps."

  },

  /* =================================
     ITALIAN VERSION
  ================================= */

  it: {

    date: "Data della cerimonia",
    time: "Orario",

    venue: "Nome del tempio",
    address: "Indirizzo completo",

    dresscode: "Abito tradizionale",

    rsvpTitle: "CONFERMA PRESENZA",

    nextButton: "CONFERMA PRESENZA →",
    rsvpButton: "INVIA CONFERMA",
    back: "← Indietro",

    name: "Nome e cognome",
    guests: "Numero di partecipanti",

    departure: "Da dove partirai?",

    messageHint:
      "Indica i nomi degli altri ospiti che verranno con te oppure eventuali servizi, richieste o domande.",

    dietary:
      "Esigenze alimentari / Allergie (se presenti)",

    sending: "Invio in corso...",

    sent:
      "Risposta inviata. Controlla Google Sheets per confermare la registrazione.",

    error:
      "Invio non riuscito. Riprova.",

    noScript:
      "Google Sheets non è ancora collegato.",

    noMap:
      "Il link di Google Maps non è disponibile."

  }

};

/* =====================================
   13. WEBSITE FUNCTIONS
===================================== */

const $ = id => document.getElementById(id);

let currentLanguage = "vi";
let guestCount = 1;

const t = () => SETTINGS[currentLanguage];

/* PAGE NAVIGATION */

function showPage(id) {

  document.querySelectorAll(".page").forEach(page => {

    const active = page.id === id;

    page.classList.toggle("active", active);

    page.setAttribute(
      "aria-hidden",
      String(!active)
    );

    page.inert = !active;

  });

}

/* OPEN LANGUAGE VERSION */

function openInvitation(language) {

  currentLanguage = language;

  updateLanguage();

  showPage("detailsPage");

}

/* =====================================
   14. LANGUAGE SWITCHING
===================================== */

function updateLanguage() {

  const a = t();

  document.documentElement.lang = currentLanguage;

  /* PAGE 2 */

  $("dateTimeText").textContent =
    a.date + " · " + a.time;

  $("venueText").textContent = a.venue;

  $("addressText").textContent = a.address;

  $("dressText").textContent = a.dresscode;

  $("goRSVP").textContent = a.nextButton;

  /* PAGE 3 TITLE */

  $("rsvpTitle").textContent = a.rsvpTitle;

  /* BACK BUTTONS */

  $("backToCover").textContent = a.back;

  $("backToDetails").textContent = a.back;

  /* RSVP INPUT PLACEHOLDERS */

  $("guestName").placeholder = a.name;

  $("guestCountLabel").textContent = a.guests;

  $("departure").placeholder = a.departure;

  $("guestMessage").placeholder = a.messageHint;

  $("dietary").placeholder = a.dietary;

  /* SUBMIT BUTTON */

  $("submitRSVP").textContent = a.rsvpButton;

  $("rsvpStatus").textContent = "";

}

/* =====================================
   15. GOOGLE MAPS
===================================== */

function openMap() {

  if (!SETTINGS.googleMapsUrl) {

    alert(t().noMap);

    return;

  }

  window.open(
    SETTINGS.googleMapsUrl,
    "_blank",
    "noopener,noreferrer"
  );

}

/* =====================================
   16. MINUS / PLUS GUEST COUNTER
===================================== */

function changeGuests(delta) {

  guestCount = Math.max(
    1,
    Math.min(20, guestCount + delta)
  );

  $("guestCount").textContent = guestCount;

  $("minusGuest").disabled = guestCount === 1;

  $("plusGuest").disabled = guestCount === 20;

}

/* =====================================
   17. SEND RSVP TO GOOGLE SHEETS
===================================== */

async function submitRSVP(event) {

  event.preventDefault();

  const a = t();

  const button = $("submitRSVP");
  const status = $("rsvpStatus");

  if (!SETTINGS.googleScriptUrl) {

    status.textContent = a.noScript;

    return;

  }

  const payload = {

    name: $("guestName").value.trim(),

    guests: guestCount,

    departure: $("departure").value.trim(),

    message: $("guestMessage").value.trim(),

    dietary: $("dietary").value.trim(),

    language: currentLanguage

  };

  if (!payload.name) {

    $("guestName").focus();

    return;

  }

  button.disabled = true;

  button.textContent = a.sending;

  status.textContent = "";

  try {

    await fetch(SETTINGS.googleScriptUrl, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(payload)

    });

    /*
      Important:
      no-cors does not confirm that
      Google Sheets saved the row.
    */

    status.textContent = a.sent;

  } catch (error) {

    console.error(error);

    status.textContent = a.error;

  } finally {

    button.disabled = false;

    button.textContent = a.rsvpButton;

  }

}

/* =====================================
   18. INITIALIZATION
===================================== */

updateLanguage();

showPage("coverPage");

changeGuests(0);

/* =====================================
   19. FLOATING PETALS
===================================== */

if (
  !window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches
) {

  for (let i = 0; i < 8; i++) {

    const petal = document.createElement("span");

    petal.className = "petal";

    petal.style.left =
      Math.random() * 100 + "%";

    petal.style.animationDuration =
      (10 + Math.random() * 8) + "s";

    petal.style.animationDelay =
      (-Math.random() * 16) + "s";

    $("card").appendChild(petal);

  }

}

</script>

</body>
</html>
