
<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Matteo & Hoà | Wedding Invitation</title>

<style>

/* ====================================
   GENERAL SETTINGS
==================================== */

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #f6f2e9;
  font-family: Georgia, "Times New Roman", serif;
  color: #8b7355;
}

main {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 10px;
}

/* ====================================
   INVITATION CARD

   Both images should be 960 x 1600
   or have the same 3:5 proportion.
==================================== */

.card {
  position: relative;
  width: min(100%, 480px);
  aspect-ratio: 3 / 5;
  overflow: hidden;
  border-radius: 6.2% / 3.7%;
  background: #fffaf2;
  isolation: isolate;
}

/* ====================================
   PAGE TRANSITIONS
==================================== */

.page {
  position: absolute;
  inset: 0;
  transition:
    opacity 1s ease,
    transform 1s ease;
}

.page img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.cover {
  z-index: 2;
  opacity: 1;
  transform: scale(1);
}

.details {
  z-index: 1;
  opacity: 0;
  transform: scale(1.025);
  pointer-events: none;
}

.card.open .cover {
  opacity: 0;
  transform: scale(1.025);
  pointer-events: none;
}

.card.open .details {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

/* ====================================
   COVER BUTTONS

   These transparent areas sit over
   APRI and MỞ THIỆP on cover.png.
==================================== */

.language-btn {
  position: absolute;
  top: 88%;
  height: 3.8%;
  z-index: 5;

  padding: 0;
  border: 0;
  border-radius: 40px;
  background: transparent;
  cursor: pointer;
}

/* APRI - LEFT BUTTON */

.italian-btn {
  left: 32.2%;
  width: 15.4%;
}

/* MỞ THIỆP - RIGHT BUTTON */

.vietnamese-btn {
  left: 51.3%;
  width: 20%;
}

/* ====================================
   TEXT OVERLAY ON DETAILS PAGE
==================================== */

.overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* CHANGE FONT, SIZE AND COLOR HERE */

.time,
.location,
.dress {
  position: absolute;

  background: transparent !important;
  box-shadow: none !important;
  border: 0 !important;
  padding: 0;
  margin: 0;

  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(9px, 2.6cqw, 13px);
  font-weight: 400;
  font-style: normal;
  color: #8b7355;
  line-height: 1.25;
  text-align: center;
}

/* ====================================
   DATE AND TIME
   First row, right of calendar icon
==================================== */

.time {
  left: 28%;
  top: 35.2%;
  width: 62%;
  height: 7.4%;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* ====================================
   LOCATION
   Second row, right of temple icon
==================================== */

.location {
  left: 45%;
  top: 45.7%;
  width: 45%;
  height: 8.6%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.location small {
  display: block;
  font-size: 0.85em;
  margin-top: 3px;
  line-height: 1.2;
}

/* ====================================
   DRESS CODE
   Third row, right of áo dài icons
==================================== */

.dress {
  left: 28%;
  top: 57.2%;
  width: 62%;
  height: 7.2%;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* ====================================
   GREEN GOOGLE MAPS BUTTON

   Transparent clickable area over
   the green button in details.png.
==================================== */

.map-link {
  position: absolute;
  left: 37.5%;
  top: 69.4%;
  width: 25%;
  height: 5.5%;

  padding: 0;
  border: none;
  border-radius: 40px;
  background: transparent;

  cursor: pointer;
  pointer-events: auto;
}

/* ====================================
   BACK BUTTON
==================================== */

.back-btn {
  position: absolute;
  right: 5%;
  bottom: 2.5%;

  padding: 7px 12px;
  border: 1px solid #a8a38d;
  border-radius: 20px;

  background: rgba(255, 251, 244, 0.92);
  color: #77775e;

  font-family: Georgia, serif;
  font-size: 11px;

  cursor: pointer;
  pointer-events: auto;
}

/* ====================================
   BUTTON ACCESSIBILITY
==================================== */

.language-btn:focus-visible,
.map-link:focus-visible,
.back-btn:focus-visible {
  outline: 2px solid #8b7355;
  outline-offset: 3px;
}

/* ====================================
   FLOATING PETALS
==================================== */

.petal {
  position: absolute;
  top: -8%;
  z-index: 4;

  width: 7px;
  height: 6px;

  border-radius: 80% 0 80% 0;
  background: #e9cfb5;
  opacity: 0.45;

  pointer-events: none;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translate(35px, 1100px) rotate(600deg);
  }
}

/* ====================================
   MOBILE
==================================== */

@media (max-width: 420px) {
  .time,
  .location,
  .dress {
    font-size: clamp(9px, 2.4vw, 11px);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

</style>
</head>

<body>

<main>

<div class="card" id="card">

  <!-- =================================
       PAGE 1: COVER
  ================================= -->

  <section class="page cover">

    <img
      src="cover.png"
      alt="Lễ Hằng Thuận - Matteo và Hoà"
    >

    <!-- APRI -->
    <button
      type="button"
      class="language-btn italian-btn"
      onclick="openInvitation('it')"
      aria-label="Apri invito in italiano"
    ></button>

    <!-- MỞ THIỆP -->
    <button
      type="button"
      class="language-btn vietnamese-btn"
      onclick="openInvitation('vi')"
      aria-label="Mở thiệp bằng tiếng Việt"
    ></button>

  </section>

  <!-- =================================
       PAGE 2: INVITATION DETAILS
  ================================= -->

  <section class="page details">

    <img
      src="details.png"
      alt="Duyên Lành Hội Ngộ"
    >

    <div class="overlay">

      <!-- DATE + TIME -->
      <div
        class="time"
        id="timeText"
      ></div>

      <!-- LOCATION -->
      <div class="location">

        <span id="venueText"></span>

        <small id="addressText"></small>

      </div>

      <!-- DRESS CODE -->
      <div
        class="dress"
        id="dressText"
      ></div>

      <!-- MAP BUTTON -->
      <button
        type="button"
        class="map-link"
        onclick="openMap()"
        aria-label="Open directions in Google Maps"
      ></button>

      <!-- BACK -->
      <button
        type="button"
        class="back-btn"
        id="backButton"
        onclick="showCover()"
      >
        ← Quay lại
      </button>

    </div>

  </section>

</div>

</main>

<script>

/* ====================================
   EDIT YOUR WEDDING INFORMATION HERE
==================================== */

const INVITATION_DETAILS = {

  /* VIETNAMESE */

  vi: {

    date: "Ngày / Tháng / Năm",

    time: "Giờ bắt đầu",

    venue: "Tên chùa / Địa điểm",

    address: "Địa chỉ đầy đủ",

    dresscode: "Áo dài truyền thống"

  },

  /* ITALIAN */

  it: {

    date: "Data della cerimonia",

    time: "Orario",

    venue: "Nome del tempio",

    address: "Indirizzo completo",

    dresscode: "Abito tradizionale"

  },

  /* GOOGLE MAPS URL FOR BOTH LANGUAGES */

  googleMapsUrl: ""

};

/* ====================================
   WEBSITE FUNCTIONS
==================================== */

const card = document.getElementById("card");

let currentLanguage = "vi";

/* CHANGE TEXT TO SELECTED LANGUAGE */

function updateInvitationLanguage() {

  const info = INVITATION_DETAILS[currentLanguage];

  document.getElementById("timeText").textContent =
    info.date + " · " + info.time;

  document.getElementById("venueText").textContent =
    info.venue;

  document.getElementById("addressText").textContent =
    info.address;

  document.getElementById("dressText").textContent =
    info.dresscode;

  document.getElementById("backButton").textContent =
    currentLanguage === "it"
      ? "← Indietro"
      : "← Quay lại";

  document.documentElement.lang = currentLanguage;

}

/* OPEN ITALIAN OR VIETNAMESE INVITATION */

function openInvitation(language) {

  currentLanguage = language;

  updateInvitationLanguage();

  card.classList.add("open");

}

/* BACK TO COVER */

function showCover() {
  card.classList.remove("open");
}

/* GOOGLE MAPS */

function openMap() {

  const url = INVITATION_DETAILS.googleMapsUrl;

  if (url) {

    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );

  } else {

    alert(
      currentLanguage === "it"
        ? "Il link di Google Maps non è ancora disponibile."
        : "Chưa có liên kết Google Maps."
    );

  }

}

/* INITIALIZE */

updateInvitationLanguage();

/* FLOATING PETALS */

if (
  !window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches
) {

  for (let i = 0; i < 12; i++) {

    const petal = document.createElement("span");

    petal.className = "petal";

    petal.style.left =
      Math.random() * 100 + "%";

    petal.style.animationDuration =
      (9 + Math.random() * 8) + "s";

    petal.style.animationDelay =
      (-Math.random() * 16) + "s";

    card.appendChild(petal);

  }

}

</script>

</body>
</html>
