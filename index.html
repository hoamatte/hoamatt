
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matteo & Hoà — Lễ Hằng Thuận</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #eae6dd;
  color: #62674e;
  font-family: Georgia, serif;
}

main {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 12px;
}

.card {
  position: relative;
  width: min(100%, 460px);
  aspect-ratio: 644 / 1023;
  overflow: hidden;
  border-radius: 24px;
  box-shadow: 0 20px 70px #514c3a30;
  background: #faf8f1;
}

.page {
  position: absolute;
  inset: 0;
  transition: opacity 1.3s ease,
              transform 1.3s ease;
}

.page img {
  width: 100%;
  height: 100%;
  display: block;
}

.cover { z-index: 2; }

.details {
  z-index: 1;
  opacity: 0;
  transform: scale(1.045);
}

.card.open .cover {
  opacity: 0;
  transform: scale(1.045);
  pointer-events: none;
}

.card.open .details {
  opacity: 1;
  transform: scale(1);
}

.open-btn {
  position: absolute;
  left: 50%;
  bottom: 3.5%;
  transform: translateX(-50%);
  background: #737b5c;
  color: white;
  border: 1px solid #858b6c;
  border-radius: 30px;
  padding: 11px 25px;
  cursor: pointer;
  white-space: nowrap;
  font-family: Georgia, serif;
  letter-spacing: 2px;
}

.overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.mask {
  background: #faf8f0;
  box-shadow: 0 0 15px 8px #faf8f0;
  border-radius: 8px;
}

.time {
  position: absolute;
  left: 41%;
  top: 38.8%;
  width: 47%;
  min-height: 6%;
  padding: 1% 2%;
  font-size: clamp(10px, 2.65vw, 17px);
}

.location {
  position: absolute;
  left: 45%;
  top: 51%;
  width: 43%;
  min-height: 7%;
  padding: 1% 2%;
  font-size: clamp(9px, 2.35vw, 15px);
  line-height: 1.4;
}

.location small {
  display: block;
  font-size: .78em;
  margin-top: 3px;
}

.dress-icon {
  position: absolute;
  left: 12.2%;
  top: 62.4%;
  width: 12%;
  height: 8%;
  display: grid;
  place-items: center;
}

.dress-icon svg {
  width: 90%;
  height: 90%;
  stroke: #73785a;
  fill: none;
  stroke-width: 2.2;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.dress {
  position: absolute;
  left: 30%;
  top: 62.5%;
  width: 54%;
  min-height: 7%;
  padding: 1% 2%;
  font-size: clamp(10px, 2.5vw, 16px);
  line-height: 1.4;
}

.dress .heading {
  font-size: .72em;
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.map-link {
  position: absolute;
  left: 24%;
  top: 72.3%;
  width: 53%;
  height: 5.5%;
  border: 0;
  border-radius: 30px;
  background: transparent;
  cursor: pointer;
  pointer-events: auto;
}

.back {
  position: absolute;
  right: 6%;
  bottom: 3.5%;
  pointer-events: auto;
  background: #f9f6ed;
  color: #62674e;
  border: 1px solid #a6aa8c;
  border-radius: 30px;
  padding: 7px 13px;
  cursor: pointer;
}

.petal {
  position: absolute;
  top: -6%;
  width: 9px;
  height: 6px;
  border-radius: 80% 0 80% 0;
  background: #dcb7a3;
  opacity: .65;
  pointer-events: none;
  animation: fall linear infinite;
  z-index: 4;
}

@keyframes fall {
  to {
    transform: translate(40px, 1100px)
               rotate(600deg);
  }
}

@media (max-width: 420px) {
  .time { font-size: 2.7vw; }
  .location { font-size: 2.4vw; }
  .dress { font-size: 2.5vw; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main>
<div class="card" id="card">

  <!-- PAGE 1: ORIGINAL COVER -->
  <section class="page cover">
    <img src="cover.jpg"
         alt="Lễ Hằng Thuận — Matteo và Hoà">

    <button class="open-btn"
            onclick="showDetails()">
      MỞ THIỆP ✧
    </button>
  </section>

  <!-- PAGE 2: EDITABLE DETAILS -->
  <section class="page details">
    <img src="details.jpg"
         alt="Thông tin lễ Hằng Thuận">

    <div class="overlay">

      <!-- DATE AND TIME -->
      <div class="time mask" id="timeText"></div>

      <!-- LOCATION -->
      <div class="location mask">
        <span id="venueText"></span>
        <small id="addressText"></small>
      </div>

      <!-- DRESS CODE HANGER -->
      <div class="dress-icon mask">
        <svg viewBox="0 0 48 48"
             aria-hidden="true">
          <path d="M24 17v-5c0-4 6-4 6 0
                   0 3-3 4-6 5"/>
          <path d="M24 17 5 32
                   Q3 34 7 36
                   H41 Q45 34 43 32
                   L24 17Z"/>
        </svg>
      </div>

      <!-- DRESS CODE TEXT -->
      <div class="dress mask">
        <div class="heading">DRESSCODE</div>
        <div id="dressText"></div>
      </div>

      <!-- MAP BUTTON -->
      <button class="map-link"
              onclick="openMap()"
              aria-label="Open Google Maps">
      </button>

      <button class="back"
              onclick="showCover()">
        ← Quay lại
      </button>

    </div>
  </section>

</div>
</main>

<script>

/*
========================================
EDIT YOUR WEDDING INFORMATION HERE
========================================
*/

const INVITATION_DETAILS = {

  date: "Ngày / Tháng / Năm",

  time: "Giờ bắt đầu",

  venue: "Tên chùa / Địa điểm",

  address: "Địa chỉ đầy đủ",

  dresscode: "Trang phục lịch sự · Màu nhã nhặn",

  googleMapsUrl: ""

};

/*
========================================
WEBSITE FUNCTIONALITY
========================================
*/

const card = document.getElementById("card");

document.getElementById("timeText").textContent =
  INVITATION_DETAILS.date + " · " +
  INVITATION_DETAILS.time;

document.getElementById("venueText").textContent =
  INVITATION_DETAILS.venue;

document.getElementById("addressText").textContent =
  INVITATION_DETAILS.address;

document.getElementById("dressText").textContent =
  INVITATION_DETAILS.dresscode;

function showDetails() {
  card.classList.add("open");
}

function showCover() {
  card.classList.remove("open");
}

function openMap() {
  if (INVITATION_DETAILS.googleMapsUrl) {
    window.open(
      INVITATION_DETAILS.googleMapsUrl,
      "_blank",
      "noopener,noreferrer"
    );
  } else {
    alert("Google Maps link not added yet.");
  }
}

// Keyboard navigation
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") showDetails();
  if (e.key === "ArrowLeft" || e.key === "Escape") {
    showCover();
  }
});

// Falling flower petals
if (!window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches) {
  for (let i = 0; i < 12; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration =
      (9 + Math.random() * 8) + "s";
    p.style.animationDelay =
      (-Math.random() * 16) + "s";
    card.appendChild(p);
  }
}

</script>
</body>
</html>
