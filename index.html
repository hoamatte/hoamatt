
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Matteo ♡ Hoà | Wedding Invitation</title>

  <style>
    :root {
      --olive: #34472d;
      --olive-light: #6b793f;
      --brown: #856b4e;
      --gold: #a88651;
      --cream: #fffaf4;
      --font-title: "Times New Roman", Georgia, serif;
      --font-body: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #f5efe7;
      color: var(--olive);
      font-family: var(--font-body);
    }

    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 8px;
    }

    .card {
      position: relative;
      width: min(
        100%,
        490px,
        calc((100svh - 16px) * 960 / 1578)
      );
      aspect-ratio: 960 / 1578;
      overflow: hidden;
      border-radius: 6% / 3.6%;
      background: var(--cream);
      container-type: inline-size;
      isolation: isolate;
    }

    /* =====================================
       SMOOTH FADING BETWEEN PAGES
    ===================================== */

    .page {
      position: absolute;
      inset: 0;
      display: block;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(12px) scale(0.985);

      transition:
        opacity 0.7s ease-in-out,
        transform 0.7s ease-in-out,
        visibility 0s linear 0.7s;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);

      transition:
        opacity 0.7s ease-in-out,
        transform 0.7s ease-in-out,
        visibility 0s;
    }

    .artwork {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .overlay {
      position: absolute;
      inset: 0;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--olive-light);
      outline-offset: 2px;
    }

    /* =====================================
       PAGE 1 — COVER
    ===================================== */

    .cover-action {
      position: absolute;
      top: 87.5%;
      height: 5%;
      padding: 0;
      border: none;
      border-radius: 30px;
      background: transparent;
    }

    #openItalian {
      left: 31%;
      width: 18%;
    }

    #openVietnamese {
      left: 50%;
      width: 24%;
    }

    /* =====================================
       PAGE 2 — CEREMONY DETAILS
    ===================================== */

    .detail-text {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      color: var(--brown);
      font-size: clamp(9px, 2.5cqw, 14px);
      line-height: 1.25;
      text-align: center;
    }

    #dateTimeText {
      left: 28%;
      top: 35.2%;
      width: 62%;
      height: 7.4%;
    }

    #locationField {
      left: 43%;
      top: 46.3%;
      width: 32%;
      height: 7%;
      flex-direction: column;
      gap: 3px;
    }

    #addressText {
      font-size: .86em;
    }

    #dressText {
      left: 28%;
      top: 58.2%;
      width: 62%;
      height: 7%;
    }

    #mapButton {
      position: absolute;
      left: 77%;
      top: 47.5%;
      width: 11%;
      height: 4%;
      padding: 0;
      border: none;
      border-radius: 99px;
      background: transparent;
    }

    /* =====================================
       NAVIGATION BUTTONS
    ===================================== */

    .nav-main {
      position: absolute;
      left: 25%;
      width: 50%;
      height: 4.8%;
      padding: 0 5px;
      border: 1px solid #737d4b;
      border-radius: 50px;
      background: rgba(255, 250, 244, .93);
      color: var(--olive);
      font-family: var(--font-title);
      font-size: clamp(10px, 2.7cqw, 15px);
      letter-spacing: .035em;
      text-align: center;
    }

    #goProgram {
      top: 76%;
    }

    .back {
      position: absolute;
      right: 5%;
      bottom: 2%;
      padding: 6px 10px;
      border: 1px solid #9b967e;
      border-radius: 20px;
      background: rgba(255, 250, 244, .94);
      color: var(--olive);
      font-size: clamp(9px, 2.3cqw, 12px);
    }

    /* =====================================
       PAGE 3 — PROGRAM & TIMELINE
    ===================================== */

    .program-content {
      position: absolute;
      top: 34%;
      left: 13%;
      width: 74%;
      height: 43%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.3cqw;
    }

    .program-intro {
      margin: 0 0 2cqw;
      color: var(--brown);
      font-family: var(--font-title);
      font-size: clamp(10px, 2.65cqw, 15px);
      letter-spacing: .08em;
      text-align: center;
    }

    .timeline {
      position: relative;
      margin: 0;
      padding: 0 0 0 11%;
      list-style: none;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 5%;
      bottom: 6%;
      left: 5%;
      width: 1px;
      background: #ba9c74;
    }

    .timeline li {
      position: relative;
      display: grid;
      grid-template-columns: 26% 1fr;
      gap: 3%;
      align-items: start;
      padding: 0 0 5.5cqw;
      font-size: clamp(10px, 2.65cqw, 15px);
    }

    .timeline li:last-child {
      padding-bottom: 0;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      left: -8.3%;
      top: .4em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid #fff9f1;
    }

    .timeline time {
      font-weight: bold;
      color: #8c7047;
    }

    .timeline strong {
      display: block;
      font-weight: normal;
      color: var(--olive);
    }

    .timeline small {
      display: block;
      margin-top: 3px;
      color: #8c7b65;
      font-size: .78em;
      line-height: 1.35;
    }

    /* MOVED HIGHER to avoid background overlap */
    #goRSVP {
      top: 73%;
      background: var(--olive-light);
      color: var(--cream);
      border-color: var(--olive-light);
    }

    /* =====================================
       PAGE 4 — RSVP
    ===================================== */

    .rsvp-title {
      position: absolute;
      top: 21.3%;
      left: 12%;
      width: 76%;
      margin: 0;
      color: var(--olive);
      font-family: var(--font-title);
      font-size: clamp(12px, 3.1cqw, 17px);
      font-weight: normal;
      letter-spacing: .18em;
      text-align: center;
    }

    .rsvp-input,
    .rsvp-message {
      position: absolute;
      left: 21%;
      width: 64%;
      margin: 0;
      padding: 0 10px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--olive);
      font-family: var(--font-body);
      font-size: clamp(10px, 2.6cqw, 14px);
    }

    .rsvp-input::placeholder,
    .rsvp-message::placeholder {
      color: #8e8979;
      opacity: 1;
    }

    #guestName {
      top: 52.7%;
      height: 2.9%;
    }

    #guestCountLabel {
      position: absolute;
      left: 21%;
      top: 57.6%;
      width: 43%;
      height: 2.9%;
      display: flex;
      align-items: center;
      color: #8e8979;
      font-size: clamp(9px, 2.5cqw, 13px);
    }

    .guest-counter {
      position: absolute;
      left: 67%;
      top: 57.6%;
      width: 18%;
      height: 2.9%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .guest-counter button {
      padding: 0 3px;
      border: none;
      background: transparent;
      color: var(--olive);
      font-size: clamp(17px, 4cqw, 22px);
    }

    .guest-counter button:disabled {
      opacity: .35;
      cursor: default;
    }

    .guest-counter span {
      font-size: clamp(11px, 3cqw, 15px);
    }

    #departure {
      top: 62.5%;
      height: 2.9%;
    }

    #guestMessage {
      top: 67.7%;
      height: 6.3%;
      padding: 9px 10px;
      resize: none;
      font-size: clamp(9px, 2.25cqw, 12px);
      line-height: 1.3;
    }

    #dietary {
      top: 75.8%;
      height: 2.9%;
    }

    #submitRSVP {
      position: absolute;
      left: 27%;
      top: 83.1%;
      width: 46%;
      height: 4.8%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14% 0 2%;
      border: none;
      border-radius: 40px;
      background: transparent;
      color: #fffaf2;
      font-family: var(--font-title);
      font-size: clamp(10px, 2.7cqw, 14px);
      letter-spacing: .04em;
      text-align: center;
    }

    #submitRSVP:disabled {
      opacity: .65;
      cursor: wait;
    }

    #rsvpStatus {
      position: absolute;
      top: 90%;
      left: 12%;
      width: 76%;
      color: var(--olive);
      font-size: clamp(9px, 2.3cqw, 12px);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .page,
      .page.active {
        transition: none;
        transform: none;
      }
    }
    
/* =====================================
   FIRST LOAD — ELEGANT FADE IN
===================================== */

@keyframes invitationFadeIn {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.card {
  animation: invitationFadeIn 1.5s ease-out both;
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
  .card {
    animation: none;
  }
}

  </style>
</head>

<body>

<main>
  <div class="card" id="card">

    <!-- PAGE 1: COVER -->
    <section class="page active" id="coverPage">

      <img
        class="artwork"
        src="cover.png"
        alt="Matteo and Hoà wedding invitation"
      >

      <div class="overlay">
        <button
          type="button"
          class="cover-action"
          id="openItalian"
          aria-label="Apri in italiano"
        ></button>

        <button
          type="button"
          class="cover-action"
          id="openVietnamese"
          aria-label="Mở thiệp tiếng Việt"
        ></button>
      </div>
    </section>

    <!-- PAGE 2: CEREMONY DETAILS -->
    <section
      class="page"
      id="detailsPage"
      inert
    >

      <img
        class="artwork"
        src="details.png"
        alt="Ceremony details"
      >

      <div class="overlay">

        <div
          class="detail-text"
          id="dateTimeText"
        ></div>

        <div
          class="detail-text"
          id="locationField"
        >
          <span id="venueText"></span>
          <small id="addressText"></small>
        </div>

        <button
          type="button"
          id="mapButton"
          aria-label="Google Maps"
        ></button>

        <div
          class="detail-text"
          id="dressText"
        ></div>

        <button
          type="button"
          class="nav-main"
          id="goProgram"
        ></button>

        <button
          type="button"
          class="back"
          id="backToCover"
        ></button>

      </div>
    </section>

    <!-- PAGE 3: PROGRAM & TIMELINE -->
    <section
      class="page"
      id="programPage"
      inert
    >

      <img
        class="artwork"
        src="program.png"
        alt="Wedding program"
      >

      <div class="overlay">

        <div class="program-content">

          <p
            class="program-intro"
            id="programIntro"
          ></p>

          <ol
            class="timeline"
            id="timeline"
          ></ol>

        </div>

        <button
          type="button"
          class="nav-main"
          id="goRSVP"
        ></button>

        <button
          type="button"
          class="back"
          id="backToDetails"
        ></button>

      </div>
    </section>

    <!-- PAGE 4: RSVP -->
    <section
      class="page"
      id="rsvpPage"
      inert
    >

      <img
        class="artwork"
        src="rsvp.png"
        alt="Wedding RSVP form"
      >

      <form
        class="overlay"
        id="rsvpForm"
      >

        <h2
          class="rsvp-title"
          id="rsvpTitle"
        ></h2>

        <input
          class="rsvp-input"
          id="guestName"
          name="name"
          type="text"
          autocomplete="name"
          maxlength="150"
          required
        >

        <span id="guestCountLabel"></span>

        <div class="guest-counter">

          <button
            type="button"
            id="minusGuest"
            aria-label="Minus one guest"
          >−</button>

          <span id="guestCount">1</span>

          <button
            type="button"
            id="plusGuest"
            aria-label="Plus one guest"
          >+</button>

        </div>

        <input
          class="rsvp-input"
          id="departure"
          name="departure"
          type="text"
          maxlength="150"
        >

        <textarea
          class="rsvp-message"
          id="guestMessage"
          name="message"
          maxlength="1000"
        ></textarea>

        <input
          class="rsvp-input"
          id="dietary"
          name="dietary"
          type="text"
          maxlength="300"
        >

        <button
          type="submit"
          id="submitRSVP"
        ></button>

        <div
          id="rsvpStatus"
          role="status"
          aria-live="polite"
        ></div>

        <button
          type="button"
          class="back"
          id="backToProgram"
        ></button>

      </form>
    </section>

  </div>
</main>

<script>
/* ==========================================
   SETTINGS — EDIT YOUR INFORMATION HERE
========================================== */

const SETTINGS = {
  googleMapsUrl: "",
  googleScriptUrl: "https://script.google.com/macros/s/AKfycbxBb947UNeFFn6hDw-p-vtFq10vsotUOCn8RI2sOOmGZ2S0z53CUMMaiQg1u5qOVj27/exec",

  vi: {
    date: "Ngày / Tháng / Năm",
    time: "Giờ bắt đầu",
    venue: "Tên chùa / Địa điểm",
    address: "Địa chỉ đầy đủ",
    dresscode: "Áo dài truyền thống",

    programButton: "CHƯƠNG TRÌNH BUỔI LỄ",
    programIntro: "CHƯƠNG TRÌNH & THỜI GIAN",

    timeline: [
      {
        time: "09:00",
        title: "Đón tiếp khách mời",
        note: "Chào đón gia đình và bạn bè"
      },
      {
        time: "09:30",
        title: "Nghi thức Lễ Hằng Thuận",
        note: "Tại chánh điện"
      },
      {
        time: "10:30",
        title: "Chụp ảnh lưu niệm",
        note: "Cùng gia đình và khách mời"
      },
      {
        time: "11:30",
        title: "Tiệc thân mật",
        note: "Gặp gỡ và chung vui"
      }
    ],

    rsvpTitle: "XÁC NHẬN THAM DỰ",
    nextButton: "XÁC NHẬN THAM DỰ",
    rsvpButton: "GỬI XÁC NHẬN",
    back: "← Quay lại",

    name: "Họ và tên",
    guests: "Số lượng tham dự",
    departure: "Bạn khởi hành từ đâu?",
    messageHint:
      "Tên người đi cùng, câu hỏi hoặc yêu cầu (nếu có)",
    dietary:
      "Yêu cầu ăn uống / Dị ứng (nếu có)",

    sending: "ĐANG GỬI...",
    sent:
      "Yêu cầu đã được gửi. Vui lòng kiểm tra Google Sheets để xác nhận.",
    error: "Không thể gửi. Vui lòng thử lại.",
    noScript: "Chưa kết nối Google Sheets.",
    noMap: "Chưa có liên kết Google Maps."
  },

  it: {
    date: "Data della cerimonia",
    time: "Orario",
    venue: "Nome del tempio",
    address: "Indirizzo completo",
    dresscode: "Abito tradizionale",

    programButton: "PROGRAMMA DELLA CERIMONIA",
    programIntro: "PROGRAMMA E ORARI",

    timeline: [
      {
        time: "09:00",
        title: "Accoglienza degli ospiti",
        note: "Benvenuto a familiari e amici"
      },
      {
        time: "09:30",
        title: "Cerimonia Hằng Thuận",
        note: "Nel tempio"
      },
      {
        time: "10:30",
        title: "Foto ricordo",
        note: "Con familiari e invitati"
      },
      {
        time: "11:30",
        title: "Ricevimento",
        note: "Un momento da condividere"
      }
    ],

    rsvpTitle: "CONFERMA PRESENZA",
    nextButton: "CONFERMA PRESENZA",
    rsvpButton: "INVIA CONFERMA",
    back: "← Indietro",

    name: "Nome e cognome",
    guests: "Numero di partecipanti",
    departure: "Da dove partirai?",
    messageHint:
      "Nomi degli accompagnatori, domande o richieste",
    dietary: "Esigenze alimentari / Allergie",

    sending: "INVIO...",
    sent:
      "Richiesta inviata. Controlla Google Sheets per confermare.",
    error: "Invio non riuscito. Riprova.",
    noScript:
      "Google Sheets non è ancora collegato.",
    noMap:
      "Il link di Google Maps non è disponibile."
  }
};

/* ==========================================
   VARIABLES
========================================== */

const $ = id => document.getElementById(id);

let currentLanguage = "vi";
let guestCount = 1;

function t() {
  return SETTINGS[currentLanguage];
}

/* ==========================================
   PAGE NAVIGATION WITH FADING
========================================== */

function showPage(pageId) {
  const pages = document.querySelectorAll(".page");

  pages.forEach(page => {
    const isActive = page.id === pageId;

    page.classList.toggle("active", isActive);
    page.inert = !isActive;

    page.setAttribute(
      "aria-hidden",
      String(!isActive)
    );
  });
}

function openInvitation(language) {
  currentLanguage = language;
  updateLanguage();
  showPage("detailsPage");
}

/* ==========================================
   BILINGUAL CONTENT
========================================== */

function updateLanguage() {
  const a = t();

  document.documentElement.lang = currentLanguage;

  $("dateTimeText").textContent =
    a.date + " · " + a.time;

  $("venueText").textContent = a.venue;
  $("addressText").textContent = a.address;
  $("dressText").textContent = a.dresscode;

  $("goProgram").textContent = a.programButton;
  $("programIntro").textContent = a.programIntro;

  const timelineItems = a.timeline.map(item => {
    const li = document.createElement("li");
    const time = document.createElement("time");
    const content = document.createElement("div");
    const title = document.createElement("strong");
    const note = document.createElement("small");

    time.textContent = item.time;
    title.textContent = item.title;
    note.textContent = item.note;

    content.append(title, note);
    li.append(time, content);

    return li;
  });

  $("timeline").replaceChildren(...timelineItems);

  $("goRSVP").textContent = a.nextButton;
  $("rsvpTitle").textContent = a.rsvpTitle;

  $("guestName").placeholder = a.name;
  $("guestCountLabel").textContent = a.guests;
  $("departure").placeholder = a.departure;
  $("guestMessage").placeholder = a.messageHint;
  $("dietary").placeholder = a.dietary;

  $("submitRSVP").textContent = a.rsvpButton;

  [
    "backToCover",
    "backToDetails",
    "backToProgram"
  ].forEach(id => {
    $(id).textContent = a.back;
  });

  $("rsvpStatus").textContent = "";
}

/* ==========================================
   GUEST COUNTER
========================================== */

function changeGuests(delta) {
  guestCount = Math.max(
    1,
    Math.min(20, guestCount + delta)
  );

  $("guestCount").textContent = guestCount;
  $("minusGuest").disabled = guestCount === 1;
  $("plusGuest").disabled = guestCount === 20;
}

/* ==========================================
   RSVP — GOOGLE SHEETS
========================================== */

async function submitRSVP(event) {
  event.preventDefault();

  const a = t();
  const button = $("submitRSVP");
  const status = $("rsvpStatus");

  const scriptUrl = SETTINGS.googleScriptUrl.trim();

  if (!scriptUrl) {
    status.textContent = a.noScript;
    return;
  }

  const payload = {
    name: $("guestName").value.trim(),
    guests: guestCount,
    departure: $("departure").value.trim(),
    message: $("guestMessage").value.trim(),
    dietary: $("dietary").value.trim(),
    language: currentLanguage
  };

  if (!payload.name) {
    $("guestName").focus();
    return;
  }

  button.disabled = true;
  button.textContent = a.sending;
  status.textContent = "";

  try {
    await fetch(scriptUrl, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });

    // no-cors cannot confirm Google Sheets
    // successfully saved the response.
    status.textContent = a.sent;

  } catch (error) {
    console.error("RSVP submission error:", error);
    status.textContent = a.error;

  } finally {
    button.disabled = false;
    button.textContent = a.rsvpButton;
  }
}

/* ==========================================
   BUTTON EVENTS
========================================== */

$("openItalian").addEventListener("click", () => {
  openInvitation("it");
});

$("openVietnamese").addEventListener("click", () => {
  openInvitation("vi");
});

$("mapButton").addEventListener("click", () => {
  if (!SETTINGS.googleMapsUrl) {
    alert(t().noMap);
    return;
  }

  window.open(
    SETTINGS.googleMapsUrl,
    "_blank",
    "noopener,noreferrer"
  );
});

$("goProgram").addEventListener("click", () => {
  showPage("programPage");
});

$("goRSVP").addEventListener("click", () => {
  showPage("rsvpPage");
});

$("backToCover").addEventListener("click", () => {
  showPage("coverPage");
});

$("backToDetails").addEventListener("click", () => {
  showPage("detailsPage");
});

$("backToProgram").addEventListener("click", () => {
  showPage("programPage");
});

$("minusGuest").addEventListener("click", () => {
  changeGuests(-1);
});

$("plusGuest").addEventListener("click", () => {
  changeGuests(1);
});

/* Only one submit listener — no page reload */
$("rsvpForm").addEventListener(
  "submit",
  submitRSVP
);

/* ==========================================
   INITIALIZE
========================================== */

updateLanguage();
showPage("coverPage");
changeGuests(0);

</script>
