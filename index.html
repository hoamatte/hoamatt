
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Matteo & Hoà | Wedding Invitation</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background: #f0ece6;
    font-family: Georgia, "Times New Roman", serif;
    color: #8b7355;
  }

  main {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 12px;
  }

  /* ===================================
     MAIN INVITATION CARD
     =================================== */

  .card {
    position: relative;
    width: min(100%, 460px);
    aspect-ratio: 3 / 5;
    overflow: hidden;
    border-radius: 22px;
    background: #faf7f1;
    box-shadow: 0 14px 40px rgba(85, 75, 55, 0.12);
    isolation: isolate;
  }

  /* ===================================
     BOTH INVITATION PAGES
     =================================== */

  .page {
    position: absolute;
    inset: 0;
    transition:
      opacity 1.1s ease,
      transform 1.1s ease;
  }

  .page img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
  }

  .cover {
    z-index: 2;
    opacity: 1;
    transform: scale(1);
  }

  .details {
    z-index: 1;
    opacity: 0;
    transform: scale(1.035);
    pointer-events: none;
  }

  .card.open .cover {
    opacity: 0;
    transform: scale(1.035);
    pointer-events: none;
  }

  .card.open .details {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* ===================================
     LANGUAGE BUTTONS ON COVER
     ===================================

     The words APRI and MỞ THIỆP
     are already printed on cover.png.

     These are transparent click areas.
     =================================== */

  .language-btn {
    position: absolute;
    top: 85.1%;
    height: 3.4%;
    z-index: 5;

    border: none;
    border-radius: 30px;
    background: transparent;
    cursor: pointer;
  }

  /* LEFT BUTTON: APRI */

  .italian-btn {
    left: 30.5%;
    width: 15.5%;
  }

  /* RIGHT BUTTON: MỞ THIỆP */

  .vietnamese-btn {
    left: 49%;
    width: 20%;
  }

  .language-btn:focus-visible,
  .map-link:focus-visible {
    outline: 2px solid #8b7355;
    outline-offset: 3px;
  }

  /* ===================================
     EDITABLE TEXT LAYER
     =================================== */

  .overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* ===================================
     SHARED TEXT APPEARANCE

     CHANGE FONT AND COLOR HERE
     =================================== */

  .time,
  .location,
  .dress {
    padding: 0;
    margin: 0;

    background: transparent !important;
    box-shadow: none !important;
    border: none !important;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(9px, 1.3vw, 12px);
    font-weight: 400;
    font-style: normal;
    color: #8b7355;
    line-height: 1.2;
    text-align: center;
  }

  /* ===================================
     FIRST ROW: DATE AND TIME

     Change top/left to move text.
     =================================== */

  .time {
    position: absolute;

    left: 27%;
    top: 36.4%;
    width: 63%;
    height: 5.4%;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===================================
     SECOND ROW: LOCATION
     =================================== */

  .location {
    position: absolute;

    left: 45%;
    top: 47.5%;
    width: 45%;
    height: 6.2%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .location small {
    display: block;
    font-size: 0.85em;
    margin-top: 3px;
    line-height: 1.2;
  }

  /* ===================================
     THIRD ROW: DRESS CODE

     ONE TEXT ONLY, NO HEADING
     =================================== */

  .dress {
    position: absolute;

    left: 27%;
    top: 59.1%;
    width: 63%;
    height: 5.4%;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===================================
     GOOGLE MAPS BUTTON

     Transparent click area over
     the green button in details.png
     =================================== */

  .map-link {
    position: absolute;

    left: 23%;
    top: 69.1%;
    width: 54%;
    height: 6.3%;

    border: none;
    border-radius: 40px;
    background: transparent;
    cursor: pointer;
    pointer-events: auto;
  }

  /* ===================================
     BACK BUTTON
     =================================== */

  .back-btn {
    position: absolute;

    right: 5%;
    bottom: 2.5%;

    padding: 7px 13px;

    border: 1px solid #a8a38d;
    border-radius: 20px;

    background: rgba(250, 248, 242, 0.9);
    color: #77775e;

    font-family: Georgia, serif;
    font-size: 11px;
    cursor: pointer;
    pointer-events: auto;
  }

  /* ===================================
     FLOATING FLOWER PETALS
     =================================== */

  .petal {
    position: absolute;
    top: -8%;
    z-index: 4;

    width: 8px;
    height: 6px;

    border-radius: 80% 0 80% 0;
    background: #e5c9b7;
    opacity: 0.55;

    pointer-events: none;
    animation: fall linear infinite;
  }

  @keyframes fall {
    to {
      transform: translate(40px, 1100px) rotate(600deg);
    }
  }

  /* ===================================
     MOBILE SETTINGS
     =================================== */

  @media (max-width: 420px) {
    .time,
    .location,
    .dress {
      font-size: 9px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>

<body>

<main>

  <div class="card" id="card">

    <!-- =============================
         PAGE 1: COVER
         ============================= -->

    <section class="page cover" id="coverPage">

      <img
        src="cover.png"
        alt="Matteo và Hoà - Lễ Hằng Thuận"
      >

      <!-- ITALIAN: APRI -->
      <button
        type="button"
        class="language-btn italian-btn"
        onclick="openInvitation('it')"
        aria-label="Apri invito in italiano"
      ></button>

      <!-- VIETNAMESE: MỞ THIỆP -->
      <button
        type="button"
        class="language-btn vietnamese-btn"
        onclick="openInvitation('vi')"
        aria-label="Mở thiệp tiếng Việt"
      ></button>

    </section>

    <!-- =============================
         PAGE 2: INVITATION DETAILS
         ============================= -->

    <section class="page details" id="detailsPage">

      <img
        src="details.png"
        alt="Duyên Lành Hội Ngộ - Chi tiết buổi lễ"
      >

      <div class="overlay">

        <!-- DATE AND TIME -->
        <div
          class="time"
          id="timeText"
        ></div>

        <!-- LOCATION -->
        <div class="location">

          <span id="venueText"></span>

          <small id="addressText"></small>

        </div>

        <!-- DRESS CODE: ONE LINE ONLY -->
        <div
          class="dress"
          id="dressText"
        ></div>

        <!-- GOOGLE MAPS -->
        <button
          type="button"
          class="map-link"
          onclick="openMap()"
          aria-label="Bản đồ chỉ đường"
        ></button>

        <!-- BACK TO COVER -->
        <button
          type="button"
          class="back-btn"
          onclick="showCover()"
        >
          ← Quay lại
        </button>

      </div>

    </section>

  </div>

</main>

<script>

/* =====================================
   EDIT ALL WEDDING INFORMATION HERE
   ===================================== */

const INVITATION_DETAILS = {

  /* ===================================
     VIETNAMESE VERSION
     =================================== */

  vi: {

    date: "Ngày / Tháng / Năm",

    time: "Giờ bắt đầu",

    venue: "Tên chùa / Địa điểm",

    address: "Địa chỉ đầy đủ",

    dresscode: "Áo dài truyền thống"

  },

  /* ===================================
     ITALIAN VERSION
     =================================== */

  it: {

    date: "Data della cerimonia",

    time: "Orario",

    venue: "Nome del tempio",

    address: "Indirizzo completo",

    dresscode: "Abito tradizionale"

  },

  /* GOOGLE MAPS LINK FOR BOTH LANGUAGES */

  googleMapsUrl: ""

};

/* =====================================
   WEBSITE FUNCTIONS
   NO NEED TO EDIT BELOW
   ===================================== */

const card = document.getElementById("card");

let currentLanguage = "vi";

/* UPDATE TEXT FOR SELECTED LANGUAGE */

function updateInvitationLanguage() {

  const info = INVITATION_DETAILS[currentLanguage];

  document.getElementById("timeText").textContent =
    info.date + " · " + info.time;

  document.getElementById("venueText").textContent =
    info.venue;

  document.getElementById("addressText").textContent =
    info.address;

  document.getElementById("dressText").textContent =
    info.dresscode;

  document.documentElement.lang = currentLanguage;

}

/* OPEN INVITATION IN SELECTED LANGUAGE */

function openInvitation(language) {

  currentLanguage = language;

  updateInvitationLanguage();

  card.classList.add("open");

}

/* BACK TO COVER */

function showCover() {

  card.classList.remove("open");

}

/* OPEN GOOGLE MAPS */

function openMap() {

  const url = INVITATION_DETAILS.googleMapsUrl;

  if (url) {

    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );

  } else {

    alert(
      currentLanguage === "it"
        ? "Il link di Google Maps non è ancora disponibile."
        : "Chưa có liên kết Google Maps."
    );

  }

}

/* KEYBOARD NAVIGATION */

document.addEventListener("keydown", function(e) {

  if (e.key === "Escape" || e.key === "ArrowLeft") {
    showCover();
  }

});

/* FLOATING FLOWER PETALS */

if (
  !window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches
) {

  for (let i = 0; i < 12; i++) {

    const petal = document.createElement("span");

    petal.className = "petal";

    petal.style.left =
      Math.random() * 100 + "%";

    petal.style.animationDuration =
      (9 + Math.random() * 8) + "s";

    petal.style.animationDelay =
      (-Math.random() * 16) + "s";

    card.appendChild(petal);

  }

}

/* INITIALIZE VIETNAMESE TEXT */

updateInvitationLanguage();

</script>

</body>
</html>
