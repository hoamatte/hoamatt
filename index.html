
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thương Mời | Matteo & Hoà</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --white: #ffffff;
  --gold: #cba04d;
  --light-gold: #ead5a4;
  --brown-gold: #916523;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--white);
  color: var(--brown-gold);
  font-family: "Playfair Display", Georgia, serif;
}

main {
  max-width: 980px;
  margin: auto;
  padding: 16px;
}

.card {
  position: relative;
  overflow: hidden;
  background: white;
  border: 1.5px solid var(--gold);
  padding: 55px 30px;
  margin: 20px 0;
  text-align: center;
  box-shadow: 0 8px 35px #b8944720;
}

.cover {
  min-height: 650px;
}

.details {
  border-radius: 38px;
  min-height: 520px;
}

.script {
  font-family: "Great Vibes", cursive;
  font-weight: normal;
  color: var(--brown-gold);
}

h1 {
  font-size: clamp(65px, 11vw, 115px);
  margin: 10px 0;
}

h2 {
  font-weight: 400;
  letter-spacing: 7px;
  font-size: clamp(20px, 4vw, 32px);
}

.names {
  font-size: clamp(70px, 12vw, 120px);
  margin: 10px 0 35px;
}

.lotus {
  width: 100px;
  height: 70px;
  margin: auto;
  fill: none;
  stroke: var(--gold);
  stroke-width: 2;
}

.lotus.small {
  width: 60px;
  height: 45px;
}

.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin: 20px auto;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  width: 110px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold)
  );
}

.divider::after {
  transform: rotate(180deg);
}

.temple {
  width: min(85%, 480px);
  margin: 40px auto 10px;
  fill: none;
  stroke: var(--gold);
  stroke-width: 2.2;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.message {
  font-family: "Great Vibes", cursive;
  font-size: clamp(26px, 4vw, 42px);
  margin-top: 40px;
}

.information {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  align-items: start;
}

.info {
  padding: 15px;
}

.info + .info {
  border-left: 1px solid var(--light-gold);
}

.info h3 {
  font-size: 22px;
  font-weight: 400;
  font-style: italic;
}

.time {
  display: inline-block;
  background: #fbf4e5;
  border-radius: 50px;
  padding: 5px 30px;
  font-size: 35px;
}

.info p {
  line-height: 1.7;
}

.map-link {
  display: inline-block;
  padding: 12px 18px;
  border: 1px solid var(--gold);
  border-radius: 35px;
  text-decoration: none;
  color: var(--brown-gold);
  transition: 0.3s;
}

.map-link:hover {
  background: #f9edcf;
}

.rsvp-button,
.submit {
  border: 0;
  border-radius: 40px;
  padding: 14px 32px;
  background: linear-gradient(
    120deg,
    #ebd6a3,
    #cba04d
  );
  color: #65491e;
  font: 20px Georgia, serif;
  cursor: pointer;
  transition: transform 0.3s;
}

.rsvp-button:hover,
.submit:hover {
  transform: translateY(-3px);
}

.open-link {
  display: inline-block;
  color: var(--brown-gold);
  text-decoration: none;
  border-bottom: 1px solid var(--gold);
  padding: 10px 20px;
  margin-top: 20px;
}

.corner {
  position: absolute;
  color: var(--gold);
  font-size: 40px;
  opacity: 0.7;
}

.top-left { top: 10px; left: 20px; }
.top-right { top: 10px; right: 20px; }
.bottom-left { bottom: 10px; left: 20px; }
.bottom-right { bottom: 10px; right: 20px; }

.petal {
  position: fixed;
  top: -40px;
  color: var(--light-gold);
  pointer-events: none;
  animation: falling linear infinite;
  z-index: 10;
}

@keyframes falling {
  to {
    transform: translate(70px, 110vh) rotate(360deg);
  }
}

dialog {
  border: 1px solid var(--gold);
  border-radius: 20px;
  background: white;
  width: min(450px, 94vw);
  padding: 30px;
  color: var(--brown-gold);
}

dialog::backdrop {
  background: #392c1a88;
}

dialog h2 {
  letter-spacing: 1px;
  font-size: 25px;
}

label {
  display: block;
  margin-top: 15px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid var(--light-gold);
  border-radius: 8px;
  font: inherit;
}

.close {
  float: right;
  border: 0;
  background: none;
  color: var(--brown-gold);
  font-size: 26px;
  cursor: pointer;
}

.submit {
  margin-top: 20px;
  font-size: 17px;
}

@media(max-width: 650px) {
  main { padding: 8px; }
  .card { padding: 45px 14px; }
  .cover { min-height: 520px; }
  .information { grid-template-columns: 1fr; }
  .info + .info {
    border-left: 0;
    border-top: 1px solid var(--light-gold);
  }
}

@media(prefers-reduced-motion: reduce) {
  .petal { display: none; }
}
</style>
</head>

<body>

<!-- HỌA TIẾT HOA SEN SVG -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="lotus" viewBox="0 0 120 80">
      <path d="M60 62 Q27 36 60 5 Q93 36 60 62Z"/>
      <path d="M60 62 Q13 52 29 18 Q55 30 60 62Z"/>
      <path d="M60 62 Q107 52 91 18 Q65 30 60 62Z"/>
      <path d="M60 62 Q8 68 5 42 Q35 40 60 62Z"/>
      <path d="M60 62 Q112 68 115 42 Q85 40 60 62Z"/>
      <path d="M20 67 Q60 78 100 67"/>
    </symbol>
  </defs>
</svg>

<main>

<!-- TRANG BÌA -->
<section class="card cover">

  <span class="corner top-left">❖</span>
  <span class="corner top-right">❖</span>
  <span class="corner bottom-left">❖</span>
  <span class="corner bottom-right">❖</span>

  <h1 class="script">Thương Mời</h1>

  <div class="divider">
    <svg class="lotus small">
      <use href="#lotus"/>
    </svg>
  </div>

  <!-- MÁI CHÙA VẼ BẰNG SVG -->
  <svg class="temple" viewBox="0 0 500 280">
    <path d="M80 120 Q130 130 155 65
             Q250 110 345 65
             Q370 130 420 120"/>
    <path d="M80 120 Q250 165 420 120"/>
    <path d="M105 150 H395"/>
    <path d="M125 160 V245 M375 160 V245"/>
    <path d="M180 160 V245 M320 160 V245"/>
    <path d="M240 160 V245 M260 160 V245"/>
    <path d="M65 180 Q120 190 140 140
             Q250 185 360 140
             Q380 190 435 180"/>
    <path d="M65 180 Q250 220 435 180"/>
    <path d="M85 210 H415"/>
    <path d="M105 210 V265 M395 210 V265"/>
    <path d="M250 25 V70"/>
    <path d="M240 35 L250 15 L260 35"/>
  </svg>

  <svg class="lotus">
    <use href="#lotus"/>
  </svg>

  <p class="message">
    Có duyên tương ngộ, có phúc đồng hành
  </p>

  <a href="#thong-tin" class="open-link">
    Mở thiệp ↓
  </a>

</section>

<!-- TRANG THÔNG TIN -->
<section class="card details" id="thong-tin">

  <svg class="lotus small">
    <use href="#lotus"/>
  </svg>

  <h2>Lễ Hằng Thuận</h2>

  <div class="names script">
    Matteo ♡ Hoà
  </div>

  <div class="information">

    <div class="info">
      <h3>Thời gian</h3>
      <div class="time">9:00</div>
      <p>
        Chủ nhật<br>
        03/01/2026
      </p>
    </div>

    <div class="info">
      <h3>Địa điểm</h3>
      <p class="script" style="font-size:42px">
        Chùa .....
      </p>
      <a href="#" id="mapLink" class="map-link">
        ♧ Link bản đồ chỉ đường ↗
      </a>
    </div>

    <div class="info">
      <h3>Trang phục</h3>
      <p class="script" style="font-size:42px">
        Áo Dài
      </p>
    </div>

  </div>

  <div class="divider">
    <svg class="lotus small">
      <use href="#lotus"/>
    </svg>
  </div>

  <button class="rsvp-button" id="rsvpOpen">
    ✓ Xác nhận tham dự →
  </button>

</section>
</main>

<!-- FORM RSVP -->
<dialog id="rsvpDialog">
  <button class="close" id="rsvpClose">×</button>

  <h2>Xác nhận tham dự</h2>
  <p>Matteo & Hoà trân trọng cảm ơn bạn!</p>

  <form id="rsvpForm">

    <label>
      Họ và tên
      <input name="name" required>
    </label>

    <label>
      Bạn sẽ tham dự?
      <select name="attendance">
        <option value="Có">Có, tôi sẽ tham dự</option>
        <option value="Không">Rất tiếc, tôi không thể tham dự</option>
      </select>
    </label>

    <label>
      Số người tham dự
      <input name="guests" type="number"
             min="0" max="20" value="1" required>
    </label>

    <label>
      Lời chúc
      <textarea name="message" rows="3"></textarea>
    </label>

    <button class="submit" type="submit">
      Gửi xác nhận
    </button>

    <p id="status" role="status"></p>

  </form>
</dialog>

<script>
// =======================================
// THAY LINK CỦA BẠN TẠI ĐÂY
// =======================================

const GOOGLE_MAPS_URL = "";

const GOOGLE_APPS_SCRIPT_URL = "";

// =======================================
// GOOGLE MAPS
// =======================================

document.getElementById("mapLink")
.addEventListener("click", function(e) {
  e.preventDefault();

  if (!GOOGLE_MAPS_URL) {
    alert("Chưa cấu hình link Google Maps.");
    return;
  }

  window.open(
    GOOGLE_MAPS_URL,
    "_blank",
    "noopener,noreferrer"
  );
});

// =======================================
// MỞ / ĐÓNG RSVP
// =======================================

const dialog = document.getElementById("rsvpDialog");

document.getElementById("rsvpOpen")
.addEventListener("click", () => dialog.showModal());

document.getElementById("rsvpClose")
.addEventListener("click", () => dialog.close());

// =======================================
// GỬI RSVP VỀ GOOGLE SHEETS
// =======================================

document.getElementById("rsvpForm")
.addEventListener("submit", async function(e) {
  e.preventDefault();

  const status = document.getElementById("status");

  if (!GOOGLE_APPS_SCRIPT_URL) {
    status.textContent =
      "Chế độ demo: chưa kết nối Google Sheets.";
    return;
  }

  const data = Object.fromEntries(
    new FormData(this)
  );

  status.textContent = "Đang gửi...";

  try {
    await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    status.textContent =
      "Đã gửi yêu cầu. Vui lòng kiểm tra Google Sheets để xác nhận.";

    this.reset();

  } catch (error) {
    status.textContent =
      "Không thể gửi. Vui lòng thử lại.";
  }
});

// =======================================
// HIỆU ỨNG CÁNH HOA RƠI
// =======================================

if (!window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches) {

  for (let i = 0; i < 14; i++) {
    const petal = document.createElement("span");

    petal.className = "petal";
    petal.textContent = "✿";

    petal.style.left =
      Math.random() * 100 + "%";

    petal.style.fontSize =
      10 + Math.random() * 12 + "px";

    petal.style.animationDuration =
      12 + Math.random() * 15 + "s";

    petal.style.animationDelay =
      -Math.random() * 25 + "s";

    document.body.appendChild(petal);
  }
}
</script>

</body>
</html>
