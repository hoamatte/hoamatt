
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Matteo ♡ Hoà | Lễ Hằng Thuận</title>

<style>
/* ==========================================
   COLORS AND FONTS
   CHANGE THESE TO CUSTOMIZE THE WEBSITE
========================================== */

:root {
  --olive: #606b39;
  --brown: #8b7355;
  --cream: #fffaf5;
  --font: Georgia, "Times New Roman", serif;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #f6f2e9;
  font-family: var(--font);
  color: var(--olive);
}

main {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 10px;
}

/* ==========================================
   CARD SIZE

   Designed for images with a 3:5 ratio.
   If your images use another ratio,
   change aspect-ratio here.
========================================== */

.card {
  position: relative;
  width: min(100%, 480px);
  aspect-ratio: 3 / 5;
  overflow: hidden;
  border-radius: 6% / 3.6%;
  background: var(--cream);
  isolation: isolate;
  container-type: inline-size;
}

/* ==========================================
   PAGE TRANSITIONS
========================================== */

.page {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: scale(1.02);

  transition:
    opacity 0.75s ease,
    transform 0.75s ease,
    visibility 0.75s;
}

.page.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: scale(1);
}

.page img.artwork {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.page-content {
  position: absolute;
  inset: 0;
}

/* ==========================================
   PAGE 1: COVER BUTTONS

   Transparent buttons over APRI and
   MỞ THIỆP already printed in cover.png
========================================== */

.cover-button {
  position: absolute;
  top: 88%;
  height: 4%;
  padding: 0;
  border: none;
  border-radius: 30px;
  background: transparent;
  cursor: pointer;
}

#openItalian {
  left: 31.8%;
  width: 16%;
}

#openVietnamese {
  left: 50.8%;
  width: 21%;
}

/* ==========================================
   PAGE 2: INVITATION DETAILS

   Text has NO background.
========================================== */

.detail-field {
  position: absolute;
  padding: 0;
  margin: 0;
  border: none;
  background: transparent;
  box-shadow: none;

  color: var(--brown);
  font-family: var(--font);
  font-weight: 400;
  font-style: normal;
  font-size: clamp(9px, 2.55cqw, 13px);
  line-height: 1.3;
  text-align: center;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* DATE + TIME */

#dateTimeText {
  left: 28%;
  top: 35.2%;
  width: 62%;
  height: 7.4%;
}

/* LOCATION */

#locationField {
  left: 44%;
  top: 45.7%;
  width: 47%;
  height: 8.6%;
  flex-direction: column;
}

#venueText {
  font-size: 1em;
}

#addressText {
  font-size: 0.85em;
  margin-top: 3px;
}

/* DRESS CODE */

#dressText {
  left: 28%;
  top: 57.2%;
  width: 62%;
  height: 7.2%;
}

/* GOOGLE MAPS BUTTON */

#mapButton {
  position: absolute;
  left: 37%;
  top: 69.4%;
  width: 26%;
  height: 5.7%;
  border: none;
  border-radius: 40px;
  background: transparent;
  cursor: pointer;
}

/* CONTINUE TO RSVP */

#goRSVP {
  position: absolute;
  left: 27%;
  bottom: 5.4%;
  width: 46%;
  min-height: 4%;

  padding: 7px 10px;
  border: 1px solid var(--olive);
  border-radius: 25px;

  background: rgba(255, 250, 245, 0.92);
  color: var(--olive);

  font-family: var(--font);
  font-size: clamp(10px, 2.7cqw, 13px);
  cursor: pointer;
}

/* ==========================================
   PAGE 3: RSVP TITLE

   THIS TITLE IS NOT IN THE IMAGE.

   It changes automatically according
   to APRI or MỞ THIỆP.
========================================== */

.rsvp-title {
  position: absolute;
  top: 19%;
  left: 12%;
  width: 76%;

  margin: 0;
  padding: 0;

  text-align: center;
  font-family: var(--font);
  font-size: clamp(15px, 4.1cqw, 21px);
  font-weight: 400;
  font-style: normal;
  letter-spacing: 0.08em;
  line-height: 1.2;

  color: var(--olive);
  background: transparent;

  pointer-events: none;
}

/* ==========================================
   RSVP FIELDS

   Aligned with the five illustrated
   blank fields in rsvp.png.
========================================== */

.rsvp-input,
.rsvp-message {
  position: absolute;
  left: 20.5%;
  width: 65%;

  padding: 0 8px;
  margin: 0;

  border: none;
  outline: none;
  background: transparent;
  box-shadow: none;

  color: var(--olive);
  font-family: var(--font);
  font-size: clamp(10px, 2.65cqw, 14px);
}

.rsvp-input::placeholder,
.rsvp-message::placeholder {
  color: #948b79;
  opacity: 0.85;
}

/* NAME */

#guestName {
  top: 53.6%;
  height: 2.6%;
}

/* DEPARTURE LOCATION */

#departure {
  top: 64.3%;
  height: 2.6%;
}

/* MESSAGE */

#guestMessage {
  top: 69.4%;
  height: 5.1%;

  resize: none;
  padding-top: 4px;
  line-height: 1.2;
  font-size: clamp(8px, 2.15cqw, 11px);
}

/* DIETARY NEEDS */

#dietary {
  top: 77.1%;
  height: 2.5%;
}

/* ==========================================
   RSVP GUEST COUNTER

   Working minus and plus controls
   in the second blank illustrated row.
========================================== */

.guest-counter {
  position: absolute;
  left: 68%;
  top: 58.8%;
  width: 18%;
  height: 3.2%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  color: var(--olive);
}

.guest-counter button {
  width: 30%;
  height: 100%;

  padding: 0;
  border: none;
  background: transparent;

  color: var(--olive);
  font-size: clamp(15px, 4cqw, 21px);
  cursor: pointer;
}

#guestCount {
  font-size: clamp(11px, 3cqw, 15px);
  min-width: 1.5em;
  text-align: center;
}

#guestCountLabel {
  position: absolute;
  left: 21%;
  top: 59.5%;
  width: 44%;

  font-size: clamp(9px, 2.5cqw, 12px);
  color: #948b79;

  pointer-events: none;
}

/* ==========================================
   RSVP SUBMIT BUTTON

   Transparent overlay over the
   illustrated green button.
========================================== */

#submitRSVP {
  position: absolute;
  left: 27%;
  top: 84.6%;
  width: 46%;
  height: 5.1%;

  padding: 0 8%;
  border: none;
  border-radius: 40px;
  background: transparent;

  color: #fffaf0;
  font-family: var(--font);
  font-size: clamp(10px, 2.7cqw, 14px);
  letter-spacing: 0.02em;
  text-align: center;

  cursor: pointer;
}

#submitRSVP:disabled {
  cursor: wait;
  opacity: 0.7;
}

/* ==========================================
   BACK BUTTONS
========================================== */

.back-button {
  position: absolute;
  right: 5%;
  bottom: 2.2%;

  padding: 6px 10px;
  border: 1px solid #a8a38d;
  border-radius: 20px;

  background: rgba(255, 250, 245, 0.94);
  color: var(--olive);

  font-family: var(--font);
  font-size: clamp(9px, 2.4cqw, 12px);
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--olive);
  outline-offset: 2px;
}

/* ==========================================
   FLOATING PETALS
========================================== */

.petal {
  position: absolute;
  z-index: 8;
  top: -5%;

  width: 7px;
  height: 5px;

  background: #e8cfb7;
  opacity: 0.35;
  border-radius: 80% 0 80% 0;

  pointer-events: none;
  animation: petalFall linear infinite;
}

@keyframes petalFall {
  to {
    transform: translate(30px, 900px) rotate(600deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .page {
    transition: none;
  }

  .petal {
    display: none;
    animation: none;
  }
}
</style>
</head>

<body>

<main>
<div class="card" id="card">

  <!-- ======================================
       PAGE 1: COVER
  ======================================= -->

  <section class="page active" id="coverPage">

    <img
      class="artwork"
      src="cover.png"
      alt="Lễ Hằng Thuận - Matteo và Hoà"
    >

    <div class="page-content">

      <!-- ITALIAN -->
      <button
        id="openItalian"
        class="cover-button"
        type="button"
        onclick="openInvitation('it')"
        aria-label="Apri invito in italiano"
      ></button>

      <!-- VIETNAMESE -->
      <button
        id="openVietnamese"
        class="cover-button"
        type="button"
        onclick="openInvitation('vi')"
        aria-label="Mở thiệp bằng tiếng Việt"
      ></button>

    </div>
  </section>

  <!-- ======================================
       PAGE 2: DETAILS
  ======================================= -->

  <section class="page" id="detailsPage">

    <img
      class="artwork"
      src="details.png"
      alt="Duyên Lành Hội Ngộ"
    >

    <div class="page-content">

      <!-- DATE AND TIME -->
      <div
        class="detail-field"
        id="dateTimeText"
      ></div>

      <!-- LOCATION -->
      <div
        class="detail-field"
        id="locationField"
      >
        <span id="venueText"></span>
        <small id="addressText"></small>
      </div>

      <!-- DRESS CODE -->
      <div
        class="detail-field"
        id="dressText"
      ></div>

      <!-- GOOGLE MAPS -->
      <button
        type="button"
        id="mapButton"
        onclick="openMap()"
        aria-label="Google Maps directions"
      ></button>

      <!-- GO TO RSVP -->
      <button
        type="button"
        id="goRSVP"
        onclick="showPage('rsvpPage')"
      ></button>

      <!-- BACK -->
      <button
        type="button"
        class="back-button"
        id="backToCover"
        onclick="showPage('coverPage')"
      ></button>

    </div>
  </section>

  <!-- ======================================
       PAGE 3: RSVP
  ======================================= -->

  <section class="page" id="rsvpPage">

    <img
      class="artwork"
      src="rsvp.png"
      alt="Wedding attendance confirmation"
    >

    <form
      class="page-content"
      id="rsvpForm"
      onsubmit="submitRSVP(event)"
    >

      <!-- DYNAMIC TITLE -->
      <h2
        id="rsvpTitle"
        class="rsvp-title"
      ></h2>

      <!-- 1. GUEST NAME -->
      <input
        class="rsvp-input"
        type="text"
        id="guestName"
        name="name"
        required
        maxlength="150"
        autocomplete="name"
      >

      <!-- 2. NUMBER OF GUESTS -->
      <span id="guestCountLabel"></span>

      <div class="guest-counter">

        <button
          type="button"
          onclick="changeGuests(-1)"
          aria-label="Remove one guest"
        >−</button>

        <span id="guestCount">1</span>

        <button
          type="button"
          onclick="changeGuests(1)"
          aria-label="Add one guest"
        >+</button>

      </div>

      <!-- 3. DEPARTURE LOCATION -->
      <input
        class="rsvp-input"
        type="text"
        id="departure"
        name="departure"
        maxlength="150"
      >

      <!-- 4. OPTIONAL MESSAGE -->
      <textarea
        class="rsvp-message"
        id="guestMessage"
        name="message"
        maxlength="1000"
      ></textarea>

      <!-- 5. DIETARY NEEDS / ALLERGIES -->
      <input
        class="rsvp-input"
        type="text"
        id="dietary"
        name="dietary"
        maxlength="300"
      >

      <!-- SUBMIT -->
      <button
        type="submit"
        id="submitRSVP"
      ></button>

      <!-- BACK -->
      <button
        type="button"
        class="back-button"
        id="backToDetails"
        onclick="showPage('detailsPage')"
      ></button>

    </form>
  </section>

</div>
</main>

<script>
/* ==========================================
   EDIT YOUR INFORMATION HERE
========================================== */

const SETTINGS = {

  /* GOOGLE MAPS LINK */
  googleMapsUrl: "",

  /* GOOGLE APPS SCRIPT URL */
  googleScriptUrl: "",

  /* ======================================
     VIETNAMESE
  ====================================== */

  vi: {

    date: "Ngày / Tháng / Năm",
    time: "Giờ bắt đầu",
    venue: "Tên chùa / Địa điểm",
    address: "Địa chỉ đầy đủ",
    dresscode: "Áo dài truyền thống",

    /* DYNAMIC RSVP TITLE */
    rsvpTitle: "XÁC NHẬN THAM DỰ",

    nextButton: "XÁC NHẬN THAM DỰ →",
    rsvpButton: "GỬI XÁC NHẬN",
    back: "← Quay lại",

    name: "Họ và tên",
    guests: "Số lượng tham dự",
    departure: "Bạn khởi hành từ đâu?",

    messageHint:
      "Vui lòng ghi tên những người đi cùng hoặc các yêu cầu, dịch vụ hay câu hỏi khác (nếu có).",

    dietary:
      "Yêu cầu ăn uống / Dị ứng (nếu có)",

    sending: "Đang gửi...",
    success: "Cảm ơn bạn đã xác nhận tham dự!",
    error: "Không thể gửi RSVP. Vui lòng thử lại.",
    noScript: "Chưa kết nối Google Sheets."
  },

  /* ======================================
     ITALIAN
  ====================================== */

  it: {

    date: "Data della cerimonia",
    time: "Orario",
    venue: "Nome del tempio",
    address: "Indirizzo completo",
    dresscode: "Abito tradizionale",

    /* DYNAMIC RSVP TITLE */
    rsvpTitle: "CONFERMA PRESENZA",

    nextButton: "CONFERMA PRESENZA →",
    rsvpButton: "INVIA CONFERMA",
    back: "← Indietro",

    name: "Nome e cognome",
    guests: "Numero di partecipanti",
    departure: "Da dove partirai?",

    messageHint:
      "Indica i nomi degli altri ospiti che verranno con te oppure eventuali servizi, richieste o domande.",

    dietary:
      "Esigenze alimentari / Allergie (se presenti)",

    sending: "Invio in corso...",
    success: "Grazie per aver confermato la tua presenza!",
    error: "Impossibile inviare la risposta. Riprova.",
    noScript: "Google Sheets non è ancora collegato."
  }
};

/* ==========================================
   STATE
========================================== */

let currentLanguage = "vi";
let guestCount = 1;

function languageText() {
  return SETTINGS[currentLanguage];
}

/* ==========================================
   PAGE NAVIGATION
========================================== */

function showPage(pageId) {

  document.querySelectorAll(".page").forEach(page => {

    const active = page.id === pageId;

    page.classList.toggle("active", active);
    page.setAttribute("aria-hidden", String(!active));

    if ("inert" in page) {
      page.inert = !active;
    }

  });

}

/* ==========================================
   OPEN ITALIAN OR VIETNAMESE
========================================== */

function openInvitation(language) {

  currentLanguage = language;

  updateLanguage();

  showPage("detailsPage");

}

/* ==========================================
   UPDATE ALL TEXT INCLUDING RSVP TITLE
========================================== */

function updateLanguage() {

  const t = languageText();

  document.documentElement.lang = currentLanguage;

  /* DETAILS */

  document.getElementById("dateTimeText").textContent =
    t.date + " · " + t.time;

  document.getElementById("venueText").textContent =
    t.venue;

  document.getElementById("addressText").textContent =
    t.address;

  document.getElementById("dressText").textContent =
    t.dresscode;

  /* RSVP TITLE */

  document.getElementById("rsvpTitle").textContent =
    t.rsvpTitle;

  /* BUTTONS */

  document.getElementById("goRSVP").textContent =
    t.nextButton;

  document.getElementById("backToCover").textContent =
    t.back;

  document.getElementById("backToDetails").textContent =
    t.back;

  document.getElementById("submitRSVP").textContent =
    t.rsvpButton;

  /* RSVP FIELDS */

  document.getElementById("guestName").placeholder =
    t.name;

  document.getElementById("guestCountLabel").textContent =
    t.guests;

  document.getElementById("departure").placeholder =
    t.departure;

  document.getElementById("guestMessage").placeholder =
    t.messageHint;

  document.getElementById("dietary").placeholder =
    t.dietary;

}

/* ==========================================
   GOOGLE MAPS
========================================== */

function openMap() {

  const url = SETTINGS.googleMapsUrl;

  if (!url) {

    alert(
      currentLanguage === "it"
        ? "Il link di Google Maps non è disponibile."
        : "Chưa có liên kết Google Maps."
    );

    return;
  }

  window.open(url, "_blank", "noopener,noreferrer");

}

/* ==========================================
   GUEST COUNTER
========================================== */

function changeGuests(amount) {

  guestCount = Math.max(
    1,
    Math.min(20, guestCount + amount)
  );

  document.getElementById("guestCount").textContent =
    guestCount;

}

/* ==========================================
   SEND RSVP TO GOOGLE SHEETS
========================================== */

async function submitRSVP(event) {

  event.preventDefault();

  const t = languageText();

  const button = document.getElementById("submitRSVP");

  if (!SETTINGS.googleScriptUrl) {
    alert(t.noScript);
    return;
  }

  const name = document.getElementById("guestName")
    .value.trim();

  if (!name) {
    document.getElementById("guestName").focus();
    return;
  }

  const payload = {

    name: name,

    guests: guestCount,

    departure: document.getElementById("departure")
      .value.trim(),

    message: document.getElementById("guestMessage")
      .value.trim(),

    dietary: document.getElementById("dietary")
      .value.trim(),

    language: currentLanguage

  };

  button.disabled = true;
  button.textContent = t.sending;

  try {

    /*
      Google Apps Script commonly does not allow
      reading the response from GitHub Pages.

      The request can be sent, but the browser
      cannot verify that Google Sheets saved it.
    */

    await fetch(SETTINGS.googleScriptUrl, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(payload)

    });

    alert(
      currentLanguage === "it"
        ? "Risposta inviata. La registrazione su Google Sheets non può essere verificata automaticamente."
        : "Đã gửi phản hồi. Hệ thống chưa thể tự xác minh dữ liệu đã được lưu vào Google Sheets."
    );

    document.getElementById("rsvpForm").reset();

    guestCount = 1;

    document.getElementById("guestCount").textContent =
      "1";

  } catch (error) {

    console.error(error);

    alert(t.error);

  } finally {

    button.disabled = false;

    button.textContent = t.rsvpButton;

  }

}

/* ==========================================
   INITIALIZE
========================================== */

updateLanguage();

showPage("coverPage");

/* ==========================================
   FLOATING PETALS
========================================== */

if (
  !window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches
) {

  const card = document.getElementById("card");

  for (let i = 0; i < 10; i++) {

    const petal = document.createElement("span");

    petal.className = "petal";

    petal.style.left =
      Math.random() * 100 + "%";

    petal.style.animationDuration =
      (9 + Math.random() * 8) + "s";

    petal.style.animationDelay =
      (-Math.random() * 16) + "s";

    card.appendChild(petal);

  }

}
</script>

</body>
</html>
