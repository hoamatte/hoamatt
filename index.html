
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matteo ♡ Hoà | Lễ Hằng Thuận</title>

<style>
/* =========================================
   COLORS AND FONTS — EDIT HERE
========================================= */
:root {
  --olive: #263b2b;
  --olive-light: #606b39;
  --brown: #856b4e;
  --cream: #fffaf4;
  --font-title: "Times New Roman", Georgia, serif;
  --font-body: Georgia, "Times New Roman", serif;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #f6f1e9;
  color: var(--olive);
  font-family: var(--font-body);
}

main {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 8px;
}

/* =========================================
   IMAGE CONTAINER
   Image ratio: 960 x 1578
========================================= */
.card {
  position: relative;
  width: min(
    100%,
    490px,
    calc((100svh - 16px) * 960 / 1578)
  );
  aspect-ratio: 960 / 1578;
  overflow: hidden;
  border-radius: 6% / 3.6%;
  background: var(--cream);
  isolation: isolate;
  container-type: inline-size;
}

/* =========================================
   PAGE TRANSITION
========================================= */
.page {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: scale(1.015);
  transition:
    opacity .65s ease,
    transform .65s ease,
    visibility .65s;
}

.page.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: scale(1);
}

.artwork {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.overlay {
  position: absolute;
  inset: 0;
}

button,
input,
textarea {
  font-family: var(--font-body);
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--olive-light);
  outline-offset: 2px;
}

/* =========================================
   PAGE 1 — COVER BUTTONS
========================================= */
.cover-action {
  position: absolute;
  top: 87.5%;
  height: 5%;
  padding: 0;
  border: none;
  border-radius: 30px;
  background: transparent;
}

#openItalian {
  left: 31%;
  width: 18%;
}

#openVietnamese {
  left: 50%;
  width: 24%;
}

/* =========================================
   PAGE 2 — DETAILS
   All text backgrounds are transparent.
========================================= */
.detail-text {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  margin: 0;
  border: none;
  background: transparent;
  box-shadow: none;
  color: var(--brown);
  font-size: clamp(9px, 2.5cqw, 14px);
  font-weight: 400;
  line-height: 1.25;
  text-align: center;
}

/* Date and time */
#dateTimeText {
  left: 28%;
  top: 35.2%;
  width: 62%;
  height: 7.4%;
}

/* Location — leaves space for map button */
#locationField {
  left: 43%;
  top: 46.3%;
  width: 32%;
  height: 7%;
  flex-direction: column;
  gap: 3px;
}

#venueText {
  font-size: 1em;
}

#addressText {
  font-size: .86em;
}

/* Dress code */
#dressText {
  left: 28%;
  top: 58.2%;
  width: 62%;
  height: 7%;
}

/* =========================================
   SMALL MAP BUTTON
   Right side of location row
========================================= */
#mapButton {
  position: absolute;
  left: 77%;
  top: 47.5%;
  width: 11%;
  height: 4%;
  padding: 0;
  border: none;
  border-radius: 99px;
  background: transparent;
}

/* =========================================
   PAGE 2 — RSVP BUTTON
   Above the bottom lotus
========================================= */
#goRSVP {
  position: absolute;
  left: 26%;
  top: 76%;
  width: 48%;
  height: 4.6%;
  padding: 0 5px;
  border: 1px solid var(--olive-light);
  border-radius: 30px;
  background: rgba(255, 250, 244, .93);
  color: var(--olive);
  font-family: var(--font-title);
  font-size: clamp(10px, 2.7cqw, 15px);
  letter-spacing: .035em;
  text-align: center;
}

/* Back buttons */
.back {
  position: absolute;
  right: 5%;
  bottom: 2%;
  padding: 6px 10px;
  border: 1px solid #9b967e;
  border-radius: 20px;
  background: rgba(255, 250, 244, .94);
  color: var(--olive-light);
  font-size: clamp(9px, 2.3cqw, 12px);
}

/* =========================================
   PAGE 3 — RSVP TITLE

   SAME STYLE AS "LỄ HẰNG THUẬN"
   Smaller size, elegant serif,
   dark olive-green color.

   TITLE IS GENERATED BY HTML.
========================================= */
.rsvp-title {
  position: absolute;

  /* POSITION */
  top: 21.3%;
  left: 12%;
  width: 76%;

  /* FONT */
  margin: 0;
  padding: 0;
  font-family: var(--font-title);
  font-size: clamp(12px, 3.1cqw, 17px);
  font-weight: 400;
  font-style: normal;
  letter-spacing: .18em;
  line-height: 1.3;
  text-transform: uppercase;
  text-align: center;

  /* COLOR */
  color: var(--olive);

  /* NO BACKGROUND */
  background: transparent;
  border: none;
  box-shadow: none;
  pointer-events: none;
}

/* =========================================
   PAGE 3 — RSVP FORM INPUTS
========================================= */
.rsvp-input,
.rsvp-message {
  position: absolute;
  left: 21%;
  width: 64%;
  margin: 0;
  padding: 0 8px;
  border: none;
  outline: none;
  box-shadow: none;
  background: transparent;
  color: var(--olive);
  font-size: clamp(10px, 2.6cqw, 14px);
}

.rsvp-input::placeholder,
.rsvp-message::placeholder {
  color: #8e8979;
  opacity: 1;
}

/* Name */
#guestName {
  top: 53.6%;
  height: 2.7%;
}

/* Number of guests label */
#guestCountLabel {
  position: absolute;
  left: 21%;
  top: 58.7%;
  width: 43%;
  height: 2.8%;
  display: flex;
  align-items: center;
  color: #8e8979;
  font-size: clamp(9px, 2.5cqw, 13px);
  pointer-events: none;
}

/* Minus and plus counter */
.guest-counter {
  position: absolute;
  left: 67%;
  top: 58.7%;
  width: 18%;
  height: 2.8%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--olive-light);
}

.guest-counter button {
  padding: 0 3px;
  border: none;
  background: transparent;
  color: var(--olive-light);
  font-size: clamp(17px, 4cqw, 22px);
}

.guest-counter button:disabled {
  opacity: .35;
  cursor: default;
}

.guest-counter span {
  font-size: clamp(11px, 3cqw, 15px);
}

/* Departure location */
#departure {
  top: 64.3%;
  height: 2.7%;
}

/* Optional message */
#guestMessage {
  top: 69.2%;
  height: 5.4%;
  padding-top: 5px;
  resize: none;
  font-size: clamp(9px, 2.25cqw, 12px);
  line-height: 1.2;
}

/* Food / allergies */
#dietary {
  top: 77.1%;
  height: 2.7%;
}

/* =========================================
   RSVP SUBMIT BUTTON
   Text over illustrated green button
========================================= */
#submitRSVP {
  position: absolute;
  left: 27%;
  top: 84.3%;
  width: 46%;
  height: 5%;
  padding: 0 12% 0 3%;
  border: none;
  border-radius: 40px;
  background: transparent;
  color: #fffaf2;
  font-family: var(--font-title);
  font-size: clamp(10px, 2.7cqw, 14px);
  letter-spacing: .04em;
  text-align: center;
}

#submitRSVP:disabled {
  opacity: .65;
  cursor: wait;
}

/* RSVP submission status */
#rsvpStatus {
  position: absolute;
  top: 90%;
  left: 12%;
  width: 76%;
  color: var(--olive-light);
  font-size: clamp(9px, 2.3cqw, 12px);
  text-align: center;
}

/* =========================================
   FLOATING PETALS
========================================= */
.petal {
  position: absolute;
  z-index: 5;
  top: -3%;
  width: 7px;
  height: 5px;
  background: #e8d0b6;
  opacity: .35;
  border-radius: 80% 0 80% 0;
  pointer-events: none;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translate(30px, 900px) rotate(500deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .page {
    transition: none;
  }

  .petal {
    display: none;
  }
}
</style>
</head>

<body>
<main>

<div class="card" id="card">

  <!-- =====================================
       PAGE 1 — COVER
  ====================================== -->
  <section
    class="page active"
    id="coverPage"
    aria-hidden="false"
  >

    <img
      class="artwork"
      src="cover.png"
      alt="Lễ Hằng Thuận — Matteo và Hoà"
    >

    <div class="overlay">

      <!-- Italian -->
      <button
        class="cover-action"
        id="openItalian"
        type="button"
        aria-label="Apri l'invito in italiano"
        onclick="openInvitation('it')"
      ></button>

      <!-- Vietnamese -->
      <button
        class="cover-action"
        id="openVietnamese"
        type="button"
        aria-label="Mở thiệp tiếng Việt"
        onclick="openInvitation('vi')"
      ></button>

    </div>
  </section>

  <!-- =====================================
       PAGE 2 — CEREMONY DETAILS
  ====================================== -->
  <section
    class="page"
    id="detailsPage"
    aria-hidden="true"
    inert
  >

    <img
      class="artwork"
      src="details.png"
      alt="Duyên Lành Hội Ngộ"
    >

    <div class="overlay">

      <!-- Date and time -->
      <div
        class="detail-text"
        id="dateTimeText"
      ></div>

      <!-- Venue and address -->
      <div
        class="detail-text"
        id="locationField"
      >
        <span id="venueText"></span>
        <small id="addressText"></small>
      </div>

      <!-- Small green map button -->
      <button
        type="button"
        id="mapButton"
        onclick="openMap()"
        aria-label="Open map directions"
      ></button>

      <!-- Dress code -->
      <div
        class="detail-text"
        id="dressText"
      ></div>

      <!-- RSVP button -->
      <button
        type="button"
        id="goRSVP"
        onclick="showPage('rsvpPage')"
      ></button>

      <!-- Back to cover -->
      <button
        type="button"
        class="back"
        id="backToCover"
        onclick="showPage('coverPage')"
      ></button>

    </div>
  </section>

  <!-- =====================================
       PAGE 3 — RSVP
  ====================================== -->
  <section
    class="page"
    id="rsvpPage"
    aria-hidden="true"
    inert
  >

    <img
      class="artwork"
      src="rsvp.png"
      alt="Wedding attendance confirmation"
    >

    <form
      class="overlay"
      id="rsvpForm"
      onsubmit="submitRSVP(event)"
    >

      <!-- Language-changing RSVP title -->
      <h2
        class="rsvp-title"
        id="rsvpTitle"
      ></h2>

      <!-- Guest name -->
      <input
        class="rsvp-input"
        id="guestName"
        name="name"
        type="text"
        autocomplete="name"
        maxlength="150"
        required
        aria-label="Guest name"
      >

      <!-- Number of guests -->
      <span id="guestCountLabel"></span>

      <div class="guest-counter">

        <button
          type="button"
          id="minusGuest"
          onclick="changeGuests(-1)"
          aria-label="Remove one guest"
        >−</button>

        <span id="guestCount">1</span>

        <button
          type="button"
          id="plusGuest"
          onclick="changeGuests(1)"
          aria-label="Add one guest"
        >+</button>

      </div>

      <!-- Departure location -->
      <input
        class="rsvp-input"
        id="departure"
        name="departure"
        type="text"
        maxlength="150"
        aria-label="Departure location"
      >

      <!-- Optional message -->
      <textarea
        class="rsvp-message"
        id="guestMessage"
        name="message"
        maxlength="1000"
        aria-label="Other guests, requests and questions"
      ></textarea>

      <!-- Dietary needs / allergies -->
      <input
        class="rsvp-input"
        id="dietary"
        name="dietary"
        type="text"
        maxlength="300"
        aria-label="Dietary needs and allergies"
      >

      <!-- Submit -->
      <button
        type="submit"
        id="submitRSVP"
      ></button>

      <!-- Submission status -->
      <div
        id="rsvpStatus"
        role="status"
        aria-live="polite"
      ></div>

      <!-- Back to details -->
      <button
        type="button"
        class="back"
        id="backToDetails"
        onclick="showPage('detailsPage')"
      ></button>

    </form>
  </section>

</div>
</main>

<script>
/* =========================================
   EDIT ALL WEDDING INFORMATION HERE
========================================= */

const SETTINGS = {

  // Paste your Google Maps link:
  googleMapsUrl: "",

  // Paste your Google Apps Script /exec URL:
  googleScriptUrl: "",

  /* =====================================
     VIETNAMESE
  ====================================== */
  vi: {

    date: "Ngày / Tháng / Năm",
    time: "Giờ bắt đầu",

    venue: "Tên chùa / Địa điểm",
    address: "Địa chỉ đầy đủ",

    dresscode: "Áo dài truyền thống",

    // PAGE 3 TITLE
    rsvpTitle: "XÁC NHẬN THAM DỰ",

    nextButton: "XÁC NHẬN THAM DỰ →",
    rsvpButton: "GỬI XÁC NHẬN",
    back: "← Quay lại",

    name: "Họ và tên",
    guests: "Số lượng tham dự",
    departure: "Bạn khởi hành từ đâu?",

    messageHint:
      "Vui lòng ghi tên những người đi cùng hoặc các yêu cầu, dịch vụ hay câu hỏi khác (nếu có).",

    dietary:
      "Yêu cầu ăn uống / Dị ứng (nếu có)",

    sending: "Đang gửi...",

    sent:
      "Đã gửi phản hồi. Vui lòng kiểm tra Google Sheets để xác nhận.",

    error:
      "Không thể gửi. Vui lòng thử lại.",

    noScript:
      "Chưa kết nối Google Sheets.",

    noMap:
      "Chưa có liên kết Google Maps."

  },

  /* =====================================
     ITALIAN
  ====================================== */
  it: {

    date: "Data della cerimonia",
    time: "Orario",

    venue: "Nome del tempio",
    address: "Indirizzo completo",

    dresscode: "Abito tradizionale",

    // PAGE 3 TITLE
    rsvpTitle: "CONFERMA PRESENZA",

    nextButton: "CONFERMA PRESENZA →",
    rsvpButton: "INVIA CONFERMA",
    back: "← Indietro",

    name: "Nome e cognome",
    guests: "Numero di partecipanti",
    departure: "Da dove partirai?",

    messageHint:
      "Indica i nomi degli altri ospiti che verranno con te oppure eventuali servizi, richieste o domande.",

    dietary:
      "Esigenze alimentari / Allergie (se presenti)",

    sending: "Invio in corso...",

    sent:
      "Risposta inviata. Controlla Google Sheets per confermare la registrazione.",

    error:
      "Invio non riuscito. Riprova.",

    noScript:
      "Google Sheets non è ancora collegato.",

    noMap:
      "Il link di Google Maps non è disponibile."

  }
};

/* =========================================
   WEBSITE FUNCTIONS
========================================= */

const $ = id => document.getElementById(id);

let currentLanguage = "vi";
let guestCount = 1;

function t() {
  return SETTINGS[currentLanguage];
}

/* PAGE NAVIGATION */

function showPage(pageId) {

  document.querySelectorAll(".page").forEach(page => {

    const active = page.id === pageId;

    page.classList.toggle("active", active);

    page.setAttribute(
      "aria-hidden",
      String(!active)
    );

    page.inert = !active;

  });

}

/* OPEN ITALIAN / VIETNAMESE */

function openInvitation(language) {

  currentLanguage = language;

  updateLanguage();

  showPage("detailsPage");

}

/* =========================================
   AUTOMATIC LANGUAGE SWITCHING
========================================= */

function updateLanguage() {

  const a = t();

  document.documentElement.lang = currentLanguage;

  /* Page 2 */

  $("dateTimeText").textContent =
    a.date + " · " + a.time;

  $("venueText").textContent = a.venue;

  $("addressText").textContent = a.address;

  $("dressText").textContent = a.dresscode;

  $("goRSVP").textContent = a.nextButton;

  /* Page 3 title */

  $("rsvpTitle").textContent = a.rsvpTitle;

  /* Back buttons */

  $("backToCover").textContent = a.back;

  $("backToDetails").textContent = a.back;

  /* RSVP form */

  $("guestName").placeholder = a.name;

  $("guestCountLabel").textContent = a.guests;

  $("departure").placeholder = a.departure;

  $("guestMessage").placeholder = a.messageHint;

  $("dietary").placeholder = a.dietary;

  $("submitRSVP").textContent = a.rsvpButton;

  $("rsvpStatus").textContent = "";

}

/* =========================================
   GOOGLE MAPS
========================================= */

function openMap() {

  if (!SETTINGS.googleMapsUrl) {
    alert(t().noMap);
    return;
  }

  window.open(
    SETTINGS.googleMapsUrl,
    "_blank",
    "noopener,noreferrer"
  );

}

/* =========================================
   GUEST COUNTER
========================================= */

function changeGuests(delta) {

  guestCount = Math.max(
    1,
    Math.min(20, guestCount + delta)
  );

  $("guestCount").textContent = guestCount;

  $("minusGuest").disabled = guestCount === 1;

  $("plusGuest").disabled = guestCount === 20;

}

/* =========================================
   GOOGLE SHEETS RSVP SUBMISSION
========================================= */

async function submitRSVP(event) {

  event.preventDefault();

  const a = t();

  const button = $("submitRSVP");
  const status = $("rsvpStatus");

  if (!SETTINGS.googleScriptUrl) {
    status.textContent = a.noScript;
    return;
  }

  const payload = {

    name: $("guestName").value.trim(),

    guests: guestCount,

    departure: $("departure").value.trim(),

    message: $("guestMessage").value.trim(),

    dietary: $("dietary").value.trim(),

    language: currentLanguage

  };

  if (!payload.name) {
    $("guestName").focus();
    return;
  }

  button.disabled = true;
  button.textContent = a.sending;
  status.textContent = "";

  try {

    await fetch(SETTINGS.googleScriptUrl, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(payload)

    });

    // no-cors cannot verify successful saving.
    status.textContent = a.sent;

  } catch (error) {

    console.error(error);

    status.textContent = a.error;

  } finally {

    button.disabled = false;

    button.textContent = a.rsvpButton;

  }

}

/* =========================================
   INITIALIZATION
========================================= */

updateLanguage();
showPage("coverPage");
changeGuests(0);

/* =========================================
   FLOATING PETALS
========================================= */

if (
  !window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches
) {

  for (let i = 0; i < 8; i++) {

    const petal = document.createElement("span");

    petal.className = "petal";

    petal.style.left =
      Math.random() * 100 + "%";

    petal.style.animationDuration =
      (10 + Math.random() * 8) + "s";

    petal.style.animationDelay =
      (-Math.random() * 16) + "s";

    $("card").appendChild(petal);

  }

}
</script>

</body>
</html>
